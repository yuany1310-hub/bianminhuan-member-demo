function renderOverview(){return `<section class="hero"><div class="eyebrow">先把数据讲清楚，再按业务跑通</div><div class="hero-grid"><div><h2>线下经营数据，<br>接得进商城，<em>对得上业务</em></h2><p class="hero-copy">减少重复建商品，正确识别老会员，掌握各店价格库存，关联消费与退款。先选一家样板门店把数据衔接和履约核对做好，再推进商城功能升级。</p><div class="hero-actions"><button class="btn primary" data-nav="catalog">查看 9 类数据清单</button><button class="btn soft" data-nav="simulator">体验 6 个目标效果模拟</button></div></div><aside class="hero-side"><b>本次先确认</b><p>双方现成能力与缺口<br>数据来源、方向和更新频率<br>谁维护主账，谁负责异常<br>单独的费用、工期与验收</p></aside></div><div class="hero-meta"><span>需求与目标效果演示 · 全部虚构数据</span><span>没有接入真实收银 / 商城系统</span></div></section><div class="count-strip"><div><strong>9</strong><b>类业务模块</b><p>模块数用于梳理业务，不直接认定接口个数。</p></div><div><strong>6</strong><b>个模拟场景</b><p>只演示目标口径与去重结果，不执行真实同步。</p></div><div><strong>3</strong><b>方共同配合</b><p>便民欢、商城方、收银服务方分别确认职责。</p></div></div><div class="section-title"><h3>分三层评估，避免把资料导入当成资金共用</h3></div><div class="three-up"><section class="scope-box"><span class="num">01 / 首次导入</span><h3>先建立可靠底稿</h3><p>核对门店、商品、各店价格库存、会员和约定范围的历史资料。</p><ul><li>保留双方编码映射</li><li>明确快照时间与历史截止点</li><li>脱敏样本先验，缺项如实记录</li></ul></section><section class="scope-box"><span class="num">02 / 持续同步</span><h3>让后续变化能跟上</h3><p>按双方能力处理新增、修改、停用、库存、消费退款和商城履约回传。</p><ul><li>方向与频率共同确认</li><li>重复、延迟和失败可追溯</li><li>交易与退款关联原单</li></ul></section><section class="scope-box finance"><span class="pill gold">资金共用专项</span><h3>资产先核对，支付另评估</h3><p>累计充值、本金、赠金、当前余额与流水分别核对。商城可支付额度不会由导入资料直接增加。</p><ul><li>确认统一主账与账户归属</li><li>另验查询、扣款、退款与对账</li><li>券、跨系统积分等能力分别评估</li></ul></section></div><div class="notice"><b>项目边界：</b>数据对接的费用、周期和验收范围单独确认。此前商城升级的报价与工期不自动覆盖数据对接；商城升级的开工条件另行确认。</div><section class="paper"><h3>建议用一家门店推进</h3><ol class="steps"><li><span>01</span><b>双方反馈标准能力</b><p>优先复用现有接口、导出模板和权限。</p></li><li><span>02</span><b>小批量脱敏样本</b><p>包含称重商品、会员、消费和退款。</p></li><li><span>03</span><b>双方业务联调</b><p>自测后共同核对映射、库存、去重与异常。</p></li><li><span>04</span><b>证据验收后启用</b><p>按授权范围验证真实业务，再扩大使用。</p></li></ol></section>`;}

function sceneMember(){const s=sim.member;return sceneHeading('03','核验会员身份，再建立映射','所有姓名、编号和脱敏手机号均为虚构样本。真实绑定仍需授权和可验证的信息。')+`<div class="two-up"><div class="scope-box"><span class="num">来源收银资料</span><h3>陈* · C1001</h3><p>脱敏手机号：138****0001<br>来源会员编号：C1001<br>累计充值额：${money(500)}（历史资料）</p></div><div class="scope-box"><span class="num">商城资料</span><h3>陈* · U001</h3><p>脱敏手机号：138****0001<br>商城会员编号：U001<br>商城可支付余额：${money(0)}</p></div></div><div class="scene-actions"><button class="btn primary" data-action="sim:member-map">模拟核验后绑定</button><button class="btn" data-action="sim:member-repeat" ${!s.mapped?'disabled':''}>重复导入同一会员</button><button class="btn soft" data-action="sim:member-conflict">模拟共用手机号冲突</button></div><div class="result-grid">${resultCell('有效示例映射',s.mapped?'1':'0',s.mapped?'C1001 ↔ U001':'需核验后对应')}${resultCell('共用手机号候选',s.conflict?'待人工':'无新增示例','有冲突不自动覆盖已有核验映射','pending')}${resultCell('新增商城可支付额',money(0),'累计充值 500 不转入商城钱包','red')}</div><div class="sim-status"><b>模拟结果：</b>${s.mapped?'重复导入继续对应 U001，不新建第二个商城身份。':'尚未建立映射。'}${s.conflict?' 另一个来源会员与同一脱敏手机号冲突，保留待人工核对，不凭姓名或手机号直接合并。':''}</div>`;}
function sceneSales(){const s=sim.sales,net=(s.sale?200:0)-(s.refund?100:0);return sceneHeading('04','销售 200、退款 100，净额只统计一次','先展示原始销售与退款核对结果。历史数据是否纳入商城积分、成长及生效时间另行确认。')+`<div class="scene-actions"><button class="btn primary" data-action="sim:sales-sale">模拟导入销售 200 元</button><button class="btn" data-action="sim:sales-refund" ${!s.sale?'disabled':''}>模拟关联退款 100 元</button><button class="btn soft" data-action="sim:sales-repeat" ${!s.refund?'disabled':''}>重复同步销售与退款</button></div><div class="sim-result"><div class="label"><span>模拟结果 · 销售净额</span><span>原单 S-DEMO-001 / 退款 R-DEMO-001</span></div><div class="value">${money(net)}</div><p>销售 ${money(s.sale?200:0)} − 已关联退款 ${money(s.refund?100:0)}；重复记录不会再次累加或冲减。</p></div><div class="result-grid">${resultCell('有效销售 / 退款记录',(s.sale?'1':'0')+' / '+(s.refund?'1':'0'),'重复事件另留记录')}${resultCell('本次新增商城积分','0 分','历史导入计分尚未启用')}${resultCell('本次新增消费成长',money(0),'不凭原始净额自动更新商城等级')}</div><div class="notice compact">现金、微信、储值本金、赠金和券等分项不足时，先展示原始数据并标注缺项。正式纳入积分与成长前，必须确认口径和生效点。</div>`;}
function sceneWallet(){const s=sim.wallet;return sceneHeading('05','余额先只读核对，共同支付另做专项','累计充值不能当作当前余额；无法拆分本金赠金时明确待核验，导入不增加商城可支付额度。')+`<div class="result-grid">${resultCell('来源累计充值',money(500),'历史累计，不是当前可支付余额')}${resultCell('当前本金余额',s.split?money(180):'待核验',s.split?'来源分项样例':'分项缺失，不自行倒推',s.split?'':'pending')}${resultCell('当前赠金余额',s.split?money(30):'待核验',s.split?'赠金与本金分开':'分项缺失，不合并入本金',s.split?'':'pending')}</div><div class="two-up"><div class="sim-result"><div class="label"><span>来源当前总额 · 只读</span><span>${s.verified?'已模拟核对':'待模拟核对'}</span></div><div class="value">${money(210)}</div><p>${s.split?'180 本金 + 30 赠金 = 210，只在此展示来源资料。':'总额仍为来源只读字段，缺少分项时标记待核验。'}</p></div><div class="sim-result"><div class="label"><span>商城可支付余额</span><span>共同支付未启用</span></div><div class="value">${money(0)}</div><p>资料核对不会转成商城资金。统一主账、扣款、退款和对账另行确认。</p></div></div><div class="scene-actions"><button class="btn primary" data-action="sim:wallet-verify">模拟核对分项资料</button><button class="btn" data-action="sim:wallet-missing">模拟本金赠金分项缺失</button><button class="btn soft" data-action="sim:wallet-restore">恢复完整分项样例</button></div><div class="notice compact">不根据“累计充值 − 当前余额”自行推算消费；充值、赠送、消费、退款与调整流水需分别核对。</div>`;}
function sceneFulfilment(){const s=sim.fulfilment;return sceneHeading('06','商城已付单核销，只更新一次履约','虚构订单 M-DEMO-001，已付 36.80 元。回传核销结果后，不再形成第二次收款、销售或库存扣减。')+`<div class="sim-result"><div class="label"><span>模拟结果 · 商城订单履约状态</span><span>M-DEMO-001</span></div><div class="value" style="font-size:31px;letter-spacing:0">${s.done?'已提货':'已付款 · 待提货'}</div><p>原支付金额 ${money(36.8)}；核销门店为虚构门店 A，操作员为 DEMO-STAFF。${s.done?'本页已接收核销事件 V-DEMO-001。':'等待模拟核销事件。'}</p></div><div class="scene-actions"><button class="btn primary" data-action="sim:fulfilment-verify">模拟接收核销结果</button><button class="btn" data-action="sim:fulfilment-repeat" ${!s.done?'disabled':''}>重复同一核销事件</button></div><div class="result-grid">${resultCell('原收款 / 销售记录','1 / 1','核销不新增收款或第二笔销售')}${resultCell('原库存扣减次数','1 次','核销不再次扣减')}${resultCell('有效核销更新',s.done?'1 次':'0 次','同一核销事件只生效一次')}</div><div class="sim-status"><b>拟定规则校验：</b>当前商城消费积分默认每单每满 100 元有效消费积 1 分，36.80 元本单向下取整为 <b>0 分</b>。此处只作校验示意，不触发积分发放或重新累计成长；实际业务生效与账本处理须联调验收。</div>`;}
function appendLog(key,text){sim[key].log.push(text);if(sim[key].log.length>7)sim[key].log.shift();}
function simulate(action){
 const i=sim.inventory,p=sim.product,m=sim.member,s=sim.sales,w=sim.wallet,f=sim.fulfilment;
 if(action==='inventory-sale'||action==='inventory-repeat'){if(i.sold){i.duplicates++;appendLog('inventory','模拟结果：S001 重复接收，跳过库存处理；当前仍为 '+i.stock+' 件。');}else{i.sold=true;i.stock=18;appendLog('inventory','模拟结果：首次处理销售 S001（2 件），20 − 2 = 18 件。');}}
 if(action==='inventory-snapshot'){if(!i.sold)return;i.fresh=true;i.stock=18;appendLog('inventory','模拟结果：接收新快照 V2=18 件，替换旧快照；其中已包含 S001，不再扣减。');}
 if(action==='product-map'){p.mapped=true;appendLog('product','模拟结果：同一 SKU 的门店 A / B 映射已在本页核对，保留各自价库。');}
 if(action==='product-unit'){p.unit=p.unit==='kg'?'jin':'kg';appendLog('product','模拟结果：改按'+(p.unit==='jin'?'斤':'公斤')+'展示；原基本单位库存不变，商城可售额度待分配。');}
 if(action==='member-map'||action==='member-repeat'){if(m.mapped){m.duplicates++;appendLog('member','模拟结果：C1001 已对应 U001，重复资料只更新原映射，不新建身份。');}else{m.mapped=true;appendLog('member','模拟结果：经示例核验流程，对应 C1001 ↔ U001；商城钱包仍为 0。');}}
 if(action==='member-conflict'){m.conflict=true;appendLog('member','模拟结果：另一个来源会员与同一脱敏手机号冲突，标记待人工核对，不自动合并。');}
 if(action==='sales-sale'){if(s.sale){s.duplicates++;appendLog('sales','模拟结果：原销售 S-DEMO-001 重复接收，净额不变。');}else{s.sale=true;appendLog('sales','模拟结果：首次归集销售 S-DEMO-001=200 元，不自动发积分或成长。');}}
 if(action==='sales-refund'){if(!s.sale)return;if(s.refund){s.duplicates++;appendLog('sales','模拟结果：原退款 R-DEMO-001 重复接收，不再减 100 元。');}else{s.refund=true;appendLog('sales','模拟结果：退款 R-DEMO-001 关联原单冲减 100 元，销售净额为 100 元。');}}
 if(action==='sales-repeat'){if(!s.refund)return;s.duplicates+=2;appendLog('sales','模拟结果：销售、退款各重复同步一次，仍各计 1 笔，净额保持 100 元。');}
 if(action==='wallet-verify'){w.verified=w.split;appendLog('wallet',w.split?'模拟结果：只读核对 180 本金 + 30 赠金 = 210；累计充值仍单列 500，商城可支付为 0。':'模拟结果：本金 / 赠金分项缺失，核对未完成，标记待核验；商城可支付为 0。');}
 if(action==='wallet-missing'){w.split=false;w.verified=false;appendLog('wallet','模拟结果：本金与赠金分项缺失，保留来源总额 210 只读，分项标记待核验。');}
 if(action==='wallet-restore'){w.split=true;w.verified=false;appendLog('wallet','模拟结果：恢复完整分项样例，等待重新核对；没有生成商城资金。');}
 if(action==='fulfilment-verify'||action==='fulfilment-repeat'){if(f.done){f.duplicates++;appendLog('fulfilment','模拟结果：V-DEMO-001 重复接收，核销仍只更新 1 次，不重复收款、销售或扣库存。');}else{f.done=true;appendLog('fulfilment','模拟结果：首次核销事件把原单更新为已提货；保留原付款、销售与库存记录。');}}
 render();
}
function renderResponsibilities(){return heading('三方分工','谁提供数据，谁适配业务，谁确认结果','优先评估两方现有标准能力。同步方向、频率、主维护系统、异常处理及接入权限由双方共同确认。')+`<section class="paper"><h3>先把业务边界画清楚</h3><div class="split-flow"><div class="system-box"><span class="pill gold">来源能力待收银方确认</span><h3 style="margin-top:11px">线下自强收银</h3><p>门店、商品、价库、会员、销售退款、储值与原积分等级。<br>提供可用标准接口、导出模板与字段口径。</p></div><div class="flow-arrows">⇄<small>方向按业务确认</small></div><div class="system-box"><span class="pill gold">适配工作待商城方评估</span><h3 style="margin-top:11px">现有线上商城</h3><p>接收或查询、编码映射、去重和展示；商城订单、支付与核销结果按承接方案回传或协同处理。</p></div></div><div class="notice compact"><b>资金共用单独评估：</b>先核对来源资产资料；统一资金主账、查询、扣款、退款及对账方案确认后，才能考虑共同支付。</div></section><section class="paper"><h3>具体分工</h3><div class="responsibility"><h4>便民欢</h4><div><p>确认经营规则、业务用途、数据授权、样板门店和验收结果；协调两边联系人与问题回收。</p><ul><li>明确新旧会员、积分、等级和储值承接口径。</li><li>提供按授权范围整理的脱敏样本，正式核验另行安排。</li><li>确认对接与商城升级各自的费用、工期和开工条件。</li></ul></div></div><div class="responsibility"><h4>线上商城开发方</h4><div><p>按业务评估接收或查询方式，提供字段模板、状态规则与接口文档，完成商城端适配。</p><ul><li>商品、会员、门店等编码映射与导入去重。</li><li>展示来源、缺项、更新时间和异常状态。</li><li>明确商城订单、库存预占、取消退款与核销承接方式。</li></ul></div></div><div class="responsibility"><h4>线下自强收银服务方</h4><div><p>确认当前版本、已开通模块、标准导出或接口能力、字段口径及第三方权限。</p><ul><li>说明现成支持、需新增开发和暂不支持的部分。</li><li>评估向商城推送，或供商城查询的实现方式。</li><li>提供可用于自测与联调的文档、样本或测试条件。</li></ul></div></div><div class="responsibility"><h4>双方共同确认</h4><div><p>同步方向与频率、原始记录主维护方、事件与状态映射、重复请求、失败重试、历史切换点，以及联调负责人。</p><ul><li>列明双方各自费用、周期与交付边界。</li><li>各自自测后，完成共同业务联调。</li><li>保留验收证据，确定正式启用与异常回退条件。</li></ul></div></div></section><div class="notice"><b>评估口径：</b>清单列的是业务模块，接口数量需要双方按实现方案拆分。若某字段或能力不支持，请写清缺项及可接受替代方案。</div><div class="inline-actions"><button class="btn primary" data-nav="feedback">逐项填写本机评估草稿</button><button class="btn" data-action="copy-group">复制微信群需求文字</button></div>`;}
function responseFor(side,id){return feedback[side][id]||{status:'pending',method:'',frequency:'',missing:'',owner:'',estimate:'',notes:''};}
function responseCount(side){return modules.filter(m=>responseFor(side,m.id).status!=='pending').length;}
function savedDescription(){if(storageError)return '当前浏览器无法保存本机草稿，请及时导出保留。';if(!feedback.savedAt)return '尚未保存 · 只在当前浏览器整理草稿。';const date=new Date(feedback.savedAt);return '本机草稿已保存 '+(Number.isFinite(date.getTime())?date.toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit'}):'')+' · 无在线协作。';}
function feedbackField(id,key,label,value,textarea=false,placeholder=''){const fieldId='feedback-'+provider+'-'+id+'-'+key;return `<div class="form-field${textarea?' full':''}"><label for="${fieldId}">${label}</label>${textarea?`<textarea id="${fieldId}" maxlength="1600" data-feedback="${id}" data-key="${key}" placeholder="${placeholder}">${esc(value)}</textarea>`:`<input id="${fieldId}" maxlength="400" value="${esc(value)}" data-feedback="${id}" data-key="${key}" placeholder="${placeholder}" autocomplete="off">`}</div>`;}
function renderFeedback(){return heading('评估反馈 · 本机草稿','逐模块记录，便于双方正式回复','可分别整理两方的能力、缺项、方式、负责人、费用周期与验收条件。填选只代表本机整理，仍须服务方正式确认。')+`<div class="notice"><b>只存当前设备和浏览器：</b>页面没有在线提交、账号协作或服务端存储。需要回收反馈时，请主动复制或导出文件发给相关人员；本页不会发送消息。</div><div class="provider-tabs" role="group" aria-label="选择评估服务方">${Object.entries(providerLabels).map(([id,label])=>`<button class="provider-tab${provider===id?' active':''}" data-provider="${id}" aria-pressed="${provider===id}">${label} · ${responseCount(id)}/9 已填状态</button>`).join('')}</div><div class="feedback-toolbar"><div class="feedback-state"><b id="feedback-save-state">${savedDescription()}</b><br>待确认 / 现成支持 / 需开发 / 暂不支持</div><div class="inline-actions"><button class="btn small" data-action="copy-feedback">复制本机反馈</button><button class="btn small soft" data-action="export-text">导出需求与反馈</button><button class="btn small danger" data-action="confirm-clear-feedback">清空本机反馈</button></div></div>${modules.map(m=>{const r=responseFor(provider,m.id);return `<section class="feedback-card" id="feedback-${m.id}" data-status="${r.status}"><div class="feedback-card-head"><h3><span>${m.id}</span>${m.name}</h3><button data-module="${m.id}">查看字段与待确认 ›</button></div><div class="form-grid"><div class="form-field"><label for="feedback-${provider}-${m.id}-status">当前能力判断</label><select id="feedback-${provider}-${m.id}-status" data-feedback="${m.id}" data-key="status">${Object.entries(statusLabels).map(([v,t])=>`<option value="${v}"${r.status===v?' selected':''}>${t}</option>`).join('')}</select><small>请选择后由对应服务方复核，不代表已完成接入。</small></div>${feedbackField(m.id,'method',fieldLabels.method,r.method,false,'由服务方填写，如：现有接口或标准导出')}${feedbackField(m.id,'frequency',fieldLabels.frequency,r.frequency,false,'谁推送 / 谁查询，更新频率待确认')}${feedbackField(m.id,'missing',fieldLabels.missing,r.missing,false,'列明可供字段及暂不能提供的部分')}${feedbackField(m.id,'owner',fieldLabels.owner,r.owner,false,'由双方确认，不预填真实联系人')}${feedbackField(m.id,'estimate',fieldLabels.estimate,r.estimate,false,'独立评估，待服务方填写')}${feedbackField(m.id,'notes',fieldLabels.notes,r.notes,true,'补充版本权限、替代方案、测试条件和验收证据要求')}</div></section>`;}).join('')}<div class="notice compact">本机保存不代表对方已回复。正式结论请由双方核对后记录，费用与工期另行确认。</div>`;}
function saveFeedback(){feedback.savedAt=new Date().toISOString();try{localStorage.setItem(storageKey,JSON.stringify(feedback));storageError=false;}catch{storageError=true;}const el=document.getElementById('feedback-save-state');if(el)el.textContent=savedDescription();}
function feedbackInput(el){const id=el.dataset.feedback,key=el.dataset.key;if(!modules.some(m=>m.id===id)||!['status',...Object.keys(fieldLabels)].includes(key))return;const row={...responseFor(provider,id)};row[key]=key==='status'?(Object.hasOwn(statusLabels,el.value)?el.value:'pending'):el.value.slice(0,1600);feedback[provider][id]=row;saveFeedback();const card=document.getElementById('feedback-'+id);if(card)card.dataset.status=row.status;if(key==='status'){for(const b of document.querySelectorAll('[data-provider]'))b.textContent=providerLabels[b.dataset.provider]+' · '+responseCount(b.dataset.provider)+'/9 已填状态';}}
function renderAcceptance(){return heading('验收准备','先选一家门店，把这些场景列清楚','下方勾选仅用于本机标记测试范围，不代表真实接口联调已通过。正式验收需要测试记录、责任人和证据。',`<b>${feedback.scope.length} / ${acceptance.length} 项</b>已列入本机准备范围`)+`<div class="notice"><b>样本建议：</b>先使用少量脱敏资料，覆盖称重商品、会员、普通消费、退款和商城核销；正式启用前再按授权范围验证真实业务。</div><div class="feedback-toolbar"><div class="feedback-state">勾选记录只保存在本机，随需求与反馈一起导出。</div><div class="inline-actions"><button class="btn small" data-action="scope-all">全部列入准备范围</button><button class="btn small" data-action="scope-none">清空准备勾选</button><button class="btn small soft" data-action="export-text">导出验收准备与反馈</button></div></div><div class="accept-list">${acceptance.map(([title,desc,sample],i)=>`<label class="accept-item${feedback.scope.includes(i)?' checked':''}"><input type="checkbox" data-acceptance="${i}" ${feedback.scope.includes(i)?'checked':''}><div><h3><span>A${String(i+1).padStart(2,'0')}</span>${title}</h3><p>${desc}</p><small>样本 / 边界：${sample}</small></div></label>`).join('')}</div><div class="notice red"><b>启用前再确认：</b>标准能力、版本权限、同步频率、异常重试、资金规则、双方费用周期与验收证据均需实际确认。模拟页面只能帮助评审目标效果。</div>`;}

async function copyText(text,label){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);toast(label+'已复制，请按需要手动发送。');return;}const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.left='-9999px';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error('clipboard unavailable');toast(label+'已复制，请按需要手动发送。');}catch{openTextDialog(label+' · 手动复制',text);}}

const initialPlan=()=>({inventoryMode:'pending',priceMode:'reference',selection:Object.fromEntries(modules.map(m=>[m.id,priorityInfo[m.id].scope]))});
function normalizePlan(raw){const p=initialPlan();if(raw&&typeof raw==='object'){if(['pending','quota','shared'].includes(raw.inventoryMode))p.inventoryMode=raw.inventoryMode;if(['reference','follow','pending'].includes(raw.priceMode))p.priceMode=raw.priceMode;for(const m of modules)if(Object.hasOwn(scopeLabels,raw.selection?.[m.id]))p.selection[m.id]=raw.selection[m.id];}return p;}
const scopeBaseInitialFeedback=initialFeedback;initialFeedback=function(){const n=scopeBaseInitialFeedback();n.plan=initialPlan();return n;};
const scopeBaseNormalizeFeedback=normalizeFeedback;normalizeFeedback=function(raw){const n=scopeBaseNormalizeFeedback(raw);n.plan=normalizePlan(raw?.plan);return n;};
try{feedback=normalizeFeedback(JSON.parse(localStorage.getItem(storageKey)||'null'));}catch{feedback.plan=initialPlan();}

function scopeChoice(id,where='card'){const value=feedback.plan.selection[id]||priorityInfo[id].scope;return `<div class="scope-choice"><label for="scope-${where}-${id}">本轮范围草稿（须双方确认）</label><select id="scope-${where}-${id}" data-scope-choice="${id}">${Object.entries(scopeLabels).map(([v,t])=>`<option value="${v}"${value===v?' selected':''}>${t}</option>`).join('')}</select></div>`;}
function planWarning(){return feedback.plan.inventoryMode==='shared'&&['later','excluded'].includes(feedback.plan.selection['09'])?'<div class="notice red"><b>范围需要调整：</b>已选择实时共享库存，预占、扣减、取消释放等必要订单事件须随首批验证。请调整09范围，或重新评估配额方案。</div>':'';}
function renderChoices(){const mode=feedback.plan.inventoryMode;return `<section class="paper"><h3>不必全部打通：先选择可售库存方案</h3><p>初始分级是评估建议。本轮接哪些字段、采用哪种方式，仍需便民欢与双方服务者确认。</p><div class="choice-grid"><button class="choice-option${mode==='quota'?' active':''}" data-inventory-choice="quota"><b>方案 A · 商城独立可售配额</b><p>给商城明确预留额度，由约定流程补货、售卖和核减。线下不能再把同一预留库存重复售卖。</p><small>相对复杂度：中，实际待评；须明确预留、补货与扣减责任。</small></button><button class="choice-option${mode==='shared'?' active':''}" data-inventory-choice="shared"><b>方案 B · 实时共享库存</b><p>依赖查询、锁定、扣减、释放及重试能力；相关商城订单事件必须随首批一起验证。</p><small>相对复杂度：较高，实际待评；需要双方共同完成并发与失败联调。</small></button></div><div class="choice-caption"><b>本机方案草稿：</b>${mode==='pending'?'尚未选择，待比较标准能力与运营成本。':mode==='quota'?'商城独立可售配额（待双方正式确认）。':'实时共享库存（待双方正式确认必要事件能力）。'} <button class="btn small" data-inventory-choice="pending">恢复待确认</button></div>${planWarning()}<div class="form-field" style="margin-top:17px"><label for="price-choice">来源价格怎样使用</label><select class="choice-select" id="price-choice" data-price-choice><option value="reference"${feedback.plan.priceMode==='reference'?' selected':''}>参考来源价格 / 首次默认值，商城自主定价</option><option value="follow"${feedback.plan.priceMode==='follow'?' selected':''}>只持续跟随指定来源字段，范围与频率待确认</option><option value="pending"${feedback.plan.priceMode==='pending'?' selected':''}>尚未确定，待双方评估</option></select><small>不同资料不一概实时同步。线上活动价、叠加规则和上架配置由商城管理，不被导入静默覆盖。</small></div></section>`;}
function renderAutonomy(){return `<section class="paper"><h3>商城保留自主经营</h3><p>收银数据提供约定基础资料，商城继续管理线上经营配置。不全量复制POS进销存、供应商与财务系统。</p><ul class="autonomy-list"><li><b>线上内容与商品形态</b>标题、主图、分类、定份或组合SKU由商城维护。</li><li><b>上架、售价与活动</b>商城自主设置；来源更新只改双方约定字段。</li><li><b>商城会员与营销规则</b>等级、积分、券和商城钱包按商城规则管理，旧线下权益不自动改写。</li><li><b>商城订单与核销</b>按库存方案回传必要事件；完整POS接单和自动记账另评。</li></ul><div class="notice compact">建议只读接线下销售退款用于统计与会员运营，历史资产按需查询。余额共用、积分互换、券线下使用和双向自动记账列为后续专项。</div></section>`;}
function renderEvidence(){return `<section class="paper"><h3>实际后台只读核对：已见入口与仍待确认</h3><p>核对日期2026.10.27。只记录页面与字段名，未执行真实导出；下面的“已见”不代表第三方接口开放。</p><div class="table-wrap"><table class="data-table"><thead><tr><th>已见页面</th><th>已见字段 / 入口（无业务值）</th><th>仍须确认</th></tr></thead><tbody><tr><td><b>商品资料</b></td><td>商品ID、货号、主条码、基本单位、规格、零售价、会员价、包装单位、状态、性质、促销时间、库存数等；已见导出按钮。</td><td>标准导出格式、第三方权限、选定商品更新条件、单位映射。</td></tr><tr><td><b>门店经营 / 库存</b></td><td>机构分店、分店价格、经营商品查询；仓库、货号、条码、单位、库存数量及上下限等。</td><td>锁定量、商城授权可售量、增量事件时间、原子预占能力未从本次列名确认。</td></tr><tr><td><b>会员 / 余额</b></td><td>会员编号、卡内号、会员类别、手机、卡状态、发行机构、累计消费额、积分、次数；储值金额、赠送金额；余额查询有零钱包金额。</td><td>三类金额分别保留，其性质与可用口径待核实；身份授权和异常映射另验。</td></tr><tr><td><b>销售 / 付款</b></td><td>机构编号、单号、单据类型、日期、销售方式、货号、单位、基本单位数量、原价、实价、促销分摊、实销金额；付款类型及金额等。</td><td>销售商品行唯一ID、退款原单关联、混合支付分摊仍须明确。</td></tr><tr><td><b>会员流水 / 积分</b></td><td>操作日期与类型、储值卡金额、赠送金额、消费后余额；原积分、加减积分、剩余积分、摘要、机构等。</td><td>积分年度批次、有效期和旧权益迁移规则未从本次列名确认。</td></tr></tbody></table></div><div class="evidence-caption"><b>资料导入工具需分清方向：</b>已见商品、会员等模板，页面说明包括.xls、不大于3MB、不大于5000行、称重商品货号5位、已有记录跳过。这是POS<strong>接收导入</strong>说明，不能据此认定商城导出格式、持续更新或双向同步规则。</div><div class="inline-actions" style="margin-top:15px"><a class="btn small" href="downloads/observed-fields.txt" download>下载已见字段摘要</a><a class="btn small" href="downloads/field-details.txt" download>下载详细候选字段</a></div></section>`;}
const scopeBaseOverview=renderOverview;renderOverview=function(){let t=scopeBaseOverview();t=t.replace('减少重复建商品，正确识别老会员，掌握各店价格库存，关联消费与退款。先选一家样板门店把数据衔接和履约核对做好，再推进商城功能升级。','先接准备线上卖的商品、必要身份与可售库存；其他资料按用途取舍。商城保留内容、定价、活动和自己的订单规则，先用一家样板店跑通必要数据。');t=t.replace('类业务模块','类候选业务模块');t=t.replace('核对门店、商品、各店价格库存、会员和约定范围的历史资料。','首批核对门店、选定线上商品对应、必要身份与可售方案，不全量复制POS资料。');t=t.replace('按双方能力处理新增、修改、停用、库存、消费退款和商城履约回传。','库存按选定方案，基础资料按约定字段变更；销售退款建议只读，回传按必要范围确定。');return t+renderChoices()+renderAutonomy()+renderEvidence();};
moduleCard=function(m){const p=priorityInfo[m.id];return `<article class="module-card"><button class="module-open" data-module="${m.id}"><div class="module-top"><span class="num">${m.id}</span><span class="pill${p.scope==='first'?' gold':''}">${p.priority}</span></div><h3>${m.name}</h3><p>${m.summary}</p><div class="priority-line">${p.complexity} · 实际待双方评估<br>${p.note}</div><div class="module-bottom"><span>字段 · 方向 · 用处 · 待确认</span><span>展开 ›</span></div></button>${scopeChoice(m.id)}</article>`;};
const scopeBaseCatalog=renderCatalog;renderCatalog=function(){return planWarning()+scopeBaseCatalog().replace('9 类业务数据，各自确认能力与缺口','按必要性选择本轮范围').replace('点击模块查看字段、同步方向、运营用途与待确认项。清单不预设接口数量；暂不支持的字段可由双方说明替代方案。','首批接必要数据，销售退款建议只读，历史资产按需核对，资金共用等另列专项。初始分级仅为建议，实施范围须双方确认。');};
const scopeBaseModuleDetails=moduleDetails;moduleDetails=function(id){scopeBaseModuleDetails(id);const p=priorityInfo[id];if(!p)return;document.querySelector('.dialog .direction')?.insertAdjacentHTML('afterend',`<div class="notice compact"><b>${p.priority}</b> · ${p.complexity}，实际待评。<br>${p.note}</div>${scopeChoice(id,'dialog')}`);};
const scopeBaseWallet=sceneWallet;sceneWallet=function(){return scopeBaseWallet().replace('不根据“累计充值 − 当前余额”自行推算消费；充值、赠送、消费、退款与调整流水需分别核对。','本例只使用本金与赠金两类，不假定零钱包金额或性质。真实资料中的储值、赠送、零钱包需分列核对；不根据累计充值减余额反推消费。');};
const scopeBaseFeedback=renderFeedback;renderFeedback=function(){return planWarning()+scopeBaseFeedback().replace('<div class="provider-tabs" role="group"','<section class="paper"><h3>本轮范围与取舍草稿</h3><p>首批必要项若暂不接，请说明替代维护方式。库存、价库和模块范围可在运营总览 / 数据清单选择；费用按选定范围分别评估。</p><div class="inline-actions" style="margin-top:13px"><button class="btn small" data-nav="overview">选择库存与价库方案</button><button class="btn small" data-nav="catalog">调整模块范围</button></div></section><div class="provider-tabs" role="group"');};
function planText(){let t='【本机范围取舍，仍须三方确认】\n库存方案：'+({pending:'待比较确认',quota:'商城独立可售配额',shared:'实时共享库存'}[feedback.plan.inventoryMode])+'\n价库使用：'+({reference:'参考来源，商城自主定价',follow:'只跟随指定来源字段，频率另定',pending:'待确认'}[feedback.plan.priceMode])+'\n';for(const m of modules)t+=m.id+' '+m.name+'：'+scopeLabels[feedback.plan.selection[m.id]]+'\n';t+='实时共享所需预占、扣减、取消释放事件随首批验证；完整POS接单和自动记账可后置。\n\n';return t;}
const scopeBaseFeedbackText=feedbackText;feedbackText=function(){return planText()+scopeBaseFeedbackText();};
const scopeBaseRequirementsText=requirementsText;requirementsText=function(){let t=scopeBaseRequirementsText();t=t.replace('目标：先跑通数据衔接，再推进商城功能升级。优先评估标准能力、导出模板与接入方式；数据对接费用、工期和验收范围独立确认。清单条数不直接认定接口个数。','目标：先跑通必要数据，再推进商城升级。清单是候选范围，不要求全部实施。首批接门店、选定线上商品对应、必要身份和可售库存方案；销售退款建议只读，历史资产按需查，余额共用、积分互换、券线下使用、双向记账后续专项。商城保留自主经营，导入只更新约定字段。费用工期独立确认，模块数量不直接认定接口个数。');for(const m of modules)t=t.replace(m.id+' '+m.name+'\n',m.id+' '+m.name+'\n建议优先级：'+priorityInfo[m.id].priority+'；'+priorityInfo[m.id].complexity+'，实际待评。\n取舍：'+priorityInfo[m.id].note+'\n');return t;};
document.addEventListener('click',e=>{const b=e.target.closest('[data-inventory-choice]');if(b&&['pending','quota','shared'].includes(b.dataset.inventoryChoice)){feedback.plan.inventoryMode=b.dataset.inventoryChoice;saveFeedback();render();}});
document.addEventListener('change',e=>{if(e.target.matches('[data-scope-choice]')){const id=e.target.dataset.scopeChoice;if(modules.some(m=>m.id===id)&&Object.hasOwn(scopeLabels,e.target.value)){feedback.plan.selection[id]=e.target.value;saveFeedback();render();}}if(e.target.matches('[data-price-choice]')&&['reference','follow','pending'].includes(e.target.value)){feedback.plan.priceMode=e.target.value;saveFeedback();}});

render();
</script>
</body>
</html>
