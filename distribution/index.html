const PRODUCT_SEEDS=[{id:'basket',name:'家庭鲜蔬菜篮',spec:'固定组合 · 1份',price:10000,series:'family',tags:['opening','daily'],color:'#59904a'},{id:'eggs',name:'鲜鸡蛋家庭装',spec:'10枚 / 盒',price:2000,series:'egg',tags:['opening'],color:'#d6a65e'},{id:'lettuce',name:'当日鲜叶菜',spec:'500g / 份',price:800,series:'family',tags:['daily'],color:'#7da246'}];
const SERIES={family:'家庭菜篮系列',egg:'安心蛋品系列'},TAG_SEEDS={opening:'开业精选',daily:'日常好物'};
const PEOPLE=[{id:'P001',name:'A',level:1,parentId:null,status:'已审核'},{id:'P002',name:'B',level:2,parentId:'P001',status:'已审核'},{id:'P003',name:'C',level:2,parentId:null,status:'已审核'},{id:'P004',name:'D',level:0,parentId:null,status:'普通消费者'},{id:'P005',name:'E',level:1,parentId:null,status:'已审核'}];
const TABS=[['overview','样板概览'],['mobile','手机端分享体验'],['products','商品标签与分佣设置'],['promoter','推广人中心'],['share','分享成交演示'],['rules','佣金规则后台'],['relations','两级关系与升级'],['roles','角色权限预览'],['logistics','快递履约与签收'],['settlement','订单结算提现'],['developer','开发评估']];
const INIT=()=>({version:4,day:0,products:PRODUCT_SEEDS.map(p=>({...p,tags:[...p.tags],active:true,commissionEnabled:true,deleted:false,storeCode:'DEMO001',revision:1})),tags:{...TAG_SEEDS},checkoutQuote:null,mobile:{view:'share',cardProduct:null,orderIds:[]},promoter:'P002',previewRole:'P001',people:PEOPLE.map(x=>({...x})),bindings:[],product:'basket',fulfillment:'express',shareScope:'sku',lastLink:null,visit:null,orders:[],withdrawals:[],wallets:Object.fromEntries(PEOPLE.map(p=>[p.id,{available:0,debt:0,paid:0}])),rules:[{id:'R1',scope:'sku',target:'basket',bp:500,parentBp:500,priority:1,enabled:true},{id:'R2',scope:'series',target:'family',bp:500,parentBp:500,priority:10,enabled:true},{id:'R3',scope:'tag',target:'opening',bp:500,parentBp:500,priority:10,enabled:true},{id:'R4',scope:'default',target:'all',bp:500,parentBp:500,priority:100,enabled:true}],excluded:[],config:{windowDays:7,afterDays:7,minWithdraw:500,selfAllowed:false},upgrade:{enabled:false,threshold:100000,entryParent:'P001',purchases:[],records:[],qualification:null},logs:[]});
let state,lastStorageSnapshot=null;try{lastStorageSnapshot=localStorage.getItem(KEY);state=JSON.parse(lastStorageSnapshot||'null');if(!state||state.version!==4)state=INIT()}catch(e){state=INIT()}
const viewParams=typeof URLSearchParams!=='undefined'?new URLSearchParams(location.search||''):{get:()=>null};
const embedMode=viewParams.get('embed')==='1',mobileMode=viewParams.get('mode')==='mobile';
let tab=embedMode?'mobile':TABS.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):(mobileMode||window.innerWidth<=640?'mobile':'overview');
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+(n/100).toFixed(2),percent=bp=>(bp/100).toFixed(bp%100?2:0)+'%',product=id=>state.products.find(x=>x.id===id),person=id=>state.people.find(x=>x.id===id),wallet=id=>state.wallets[id]||{available:0,debt:0,paid:0};
const date=d=>{const dt=new Date(Date.UTC(2026,10,2+d));return `${dt.getUTCMonth()+1}月${dt.getUTCDate()}日`};
const save=()=>{try{lastStorageSnapshot=JSON.stringify(state);localStorage.setItem(KEY,lastStorageSnapshot)}catch(e){toast('本机存储不可用，本次操作仅保留到刷新前')}};

function acceptBusinessUpdate(raw){if(!raw||raw===lastStorageSnapshot)return false;try{const incoming=JSON.parse(raw);if(incoming.version!==4)return false;const context={mobile:{...state.mobile,orderIds:[...new Set([...(incoming.mobile?.orderIds||[]),...(state.mobile?.orderIds||[])])]},lastLink:state.lastLink,visit:state.visit,shareScope:state.shareScope,fulfillment:state.fulfillment,checkoutQuote:state.checkoutQuote,product:state.product,promoter:state.promoter,previewRole:state.previewRole,editingProduct:state.editingProduct,productDraft:state.productDraft,bindingChildId:state.bindingChildId};state={...incoming,...context};lastStorageSnapshot=raw;return true}catch(e){return false}}
function refreshBusinessState(){try{return acceptBusinessUpdate(localStorage.getItem(KEY))}catch(e){return false}}
window.addEventListener('storage',event=>{if(event.key!==KEY)return;if(tab==='products')captureProductDraft();if(acceptBusinessUpdate(event.newValue))render()});
if(document.addEventListener){document.addEventListener('click',()=>refreshBusinessState(),true);document.addEventListener('change',()=>refreshBusinessState(),true)}

function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function log(t){state.logs.unshift({day:state.day,text:t});state.logs=state.logs.slice(0,40)}
function goto(id){tab=id;location.hash=id;render();window.scrollTo({top:0,behavior:'smooth'})}
window.addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(TABS.some(x=>x[0]===n)&&tab!==n){tab=n;render()}});
function commit(msg){save();render();if(msg)toast(msg)}
function art(p){return `<div class="art" aria-hidden="true"><svg viewBox="0 0 180 140"><ellipse cx="90" cy="120" rx="65" ry="8" fill="#dfd0ad"/>${p.id==='eggs'?'<path d="M30 85h120l-9 29H39z" fill="#b69c70"/><g fill="#fff6df" stroke="#e7d8b7" stroke-width="2"><ellipse cx="59" cy="67" rx="18" ry="25"/><ellipse cx="97" cy="64" rx="18" ry="27"/><ellipse cx="129" cy="75" rx="16" ry="22"/></g>':'<path d="M35 76h110l-12 42H47z" fill="#c69959"/><path d="M34 76h112v10H34z" fill="#e2ba76"/><g fill="'+p.color+'"><ellipse cx="56" cy="61" rx="21" ry="31" transform="rotate(-25 56 61)"/><ellipse cx="98" cy="54" rx="23" ry="34" transform="rotate(10 98 54)"/><ellipse cx="123" cy="67" rx="20" ry="24"/></g><path d="M56 36l12 45M98 26l-3 56M130 48l-8 34" stroke="#aec58a" stroke-width="3"/><circle cx="82" cy="81" r="20" fill="#df6141"/><path d="M79 63l5 7 8-4-4 9" fill="#45754c"/>'}<path d="M54 91h74M58 101h66M70 86l5 27M97 86l-1 27M120 86l-6 27" stroke="#aa7b3e" stroke-width="2" opacity=".5"/></svg></div>`}

function orderProduct(o){return o.productSnapshot||product(o.product)||{id:o.product,name:'历史商品',spec:'按原单快照',price:o.paid,tags:[],series:'family'}}
function getProducts(options={}){return state.products.filter(p=>options.includeDeleted||!p.deleted).map(p=>({...p,tags:[...p.tags]}))}
function promotableProducts(){return state.products.filter(p=>p.active&&!p.deleted&&p.commissionEnabled&&!resolveRule(p.id).excluded&&!resolveRule(p.id).conflict)}
function saveProduct(input){refreshBusinessState();const old=input.id?product(input.id):null;if(input.id&&!old)return toast('未找到商品');const name=String(input.name||'').trim(),spec=String(input.spec||'').trim(),price=input.price,series=input.series,tags=Array.isArray(input.tags)?[...new Set(input.tags)]:[];if(!name||name.length>40||!spec||spec.length>60)return toast('商品名称与规格必填，分别不超过40/60字');if(!Number.isSafeInteger(price)||price<1||price>10000000)return toast('价格须为0.01至100000元，最多两位小数');if(!SERIES[series]||tags.some(t=>!state.tags[t]))return toast('请选择有效系列和标签');for(const key of ['active','commissionEnabled','deleted'])if(input[key]!==undefined&&typeof input[key]!=='boolean')return toast('商品状态须为开关值');const p={...(old||{}),id:old?.id||'product'+(state.products.length+1),name,spec,price,series,tags,active:input.active??old?.active??true,commissionEnabled:input.commissionEnabled??old?.commissionEnabled??false,deleted:input.deleted??old?.deleted??false,storeCode:'DEMO001',color:old?.color||'#739953',revision:(old?.revision||0)+1};const proposed=old?state.products.map(x=>x.id===p.id?p:x):[...state.products,p],error=validateRules(state.rules,proposed);if(error)return toast('商品标签范围冲突：'+error);state.products=proposed;log(`保存总部商品源${esc(p.name)}与样板门店配置，旧单快照不变`);commit('商品已保存；标签不是分佣授权，新商品默认不分佣');return p.id}
function setProductState(id,patch){refreshBusinessState();const old=product(id);if(!old)return toast('未找到商品');for(const [key,value] of Object.entries(patch))if(!['active','commissionEnabled','deleted'].includes(key)||typeof value!=='boolean')return toast('仅能更新上架、分佣和移除开关');return saveProduct({...old,...patch,tags:[...old.tags]})}
function addTag(name){refreshBusinessState();name=String(name||'').trim();if(!name||name.length>16)return toast('标签名称必填且不超过16字');if(Object.values(state.tags).some(x=>x===name))return toast('该标签已存在');let i=1;while(state.tags['tag'+i])i++;const id='tag'+i;state.tags[id]=name;log('新建商品标签'+name);commit('标签已建立；仅添加标签不会开启商品分佣');return id}

function captureProductDraft(){if(!$('editProductName'))return;state.productDraft={id:state.editingProduct||null,name:$('editProductName').value,spec:$('editProductSpec').value,priceRaw:$('editProductPrice').value,series:$('editProductSeries').value,tags:[...document.querySelectorAll('.productTag:checked')].map(x=>x.value),active:$('editProductActive').checked,commissionEnabled:$('editProductCommission').checked}}
function productForm(p){const draft=state.productDraft&&(state.productDraft.id||null)===(p?.id||null)?state.productDraft:null,v={name:draft?.name??p?.name??'',spec:draft?.spec??p?.spec??'',priceRaw:draft?.priceRaw??(p?p.price/100:''),series:draft?.series??p?.series??'family',tags:draft?.tags??p?.tags??[],active:draft?.active??p?.active??true,commissionEnabled:draft?.commissionEnabled??p?.commissionEnabled??false};return `<div class="form-grid"><label class="field">商品名称<input id="editProductName" maxlength="40" value="${esc(v.name)}"></label><label class="field">规格 / 计价单位<input id="editProductSpec" maxlength="60" value="${esc(v.spec)}"></label><label class="field">样板门店售价（元）<input id="editProductPrice" type="number" min="0.01" step="0.01" value="${esc(v.priceRaw)}"></label><label class="field">商品源系列<select id="editProductSeries">${Object.entries(SERIES).map(([id,name])=>`<option value="${id}" ${v.series===id?'selected':''}>${esc(name)}</option>`).join('')}</select></label><div class="field wide">商品源标签<div class="radio-row">${Object.entries(state.tags).map(([id,name])=>`<label><input class="productTag" type="checkbox" value="${id}" ${v.tags.includes(id)?'checked':''}>${esc(name)}</label>`).join('')}</div></div><label class="check"><input id="editProductActive" type="checkbox" ${v.active?'checked':''}>样板门店上架</label><label class="check"><input id="editProductCommission" type="checkbox" ${v.commissionEnabled?'checked':''}>此门店SKU参与分佣</label></div><div class="actions"><button class="btn red" data-action="saveProductForm">${p?'保存修改':'新增商品（默认不分佣）'}</button>${p?'<button class="btn" data-action="cancelProductEdit">取消编辑</button>':''}</div>`}

function products(){const editing=state.editingProduct?product(state.editingProduct):null;return `<div class="section-top"><div><div class="eyebrow">运营后台 / 商品源与门店SKU</div><h2>商品能增减，标签与分佣各自可控。</h2><p class="intro">总部统一维护名称、规格、系列与标签；门店独立售价、上架、库存与是否分佣。当前仅演示一个样板门店，库存/收银与全门店同步尚未接入。</p></div><a class="btn red" href="?mode=mobile#mobile" target="_blank" rel="noopener">手机端看分享效果 →</a></div><div class="info">商品分佣开关是总闸。关闭分佣仍可正常购买；下架或软删除才阻止新购买。加标签不会自动开启分佣，旧支付订单始终沿用商品、价格、关系与比例快照。</div><div class="card space-top"><h3>${editing?'编辑商品：'+esc(editing.name):'新增总部商品源 / 样板门店配置'}</h3>${productForm(editing)}<div class="inline-field space-top"><input id="newTagName" maxlength="16" placeholder="新增标签名称"><button class="btn" data-action="addTag">新增标签</button></div></div><div class="card space-top"><h3>商品列表 / 样板店配置</h3><div class="table-wrap space-top"><table><thead><tr><th>商品 / 规格</th><th>售价 / 标签</th><th>上架与分佣</th><th>操作</th></tr></thead><tbody>${state.products.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.spec)} · ${SERIES[p.series]}${p.deleted?' · 已软删除':''}</small></td><td>${money(p.price)}<br><small>${p.tags.map(t=>esc(state.tags[t])).join(' / ')||'无标签'}</small></td><td><span class="status">${p.active&&!p.deleted?'上架':'不可购买'}</span><br><small>${p.commissionEnabled?'参与分佣':'不分佣，正常上架仍可买'}</small></td><td><div class="table-actions"><button class="btn small" data-edit-product="${p.id}">编辑</button><button class="btn small" data-product-state="${p.id}" data-state-field="active" data-state-value="${!p.active}">${p.active?'下架':'上架'}</button><button class="btn small" data-product-state="${p.id}" data-state-field="commissionEnabled" data-state-value="${!p.commissionEnabled}">${p.commissionEnabled?'停用分佣':'开启分佣'}</button><button class="btn small" data-product-state="${p.id}" data-state-field="deleted" data-state-value="${!p.deleted}">${p.deleted?'恢复商品':'软删除'}</button></div></td></tr>`).join('')}</tbody></table></div></div>`}

function setMobileView(view){if(!['share','buy','wallet','orders'].includes(view))return;state.mobile.view=view;if(view==='buy'){const p=product(state.product);if(p&&(!state.checkoutQuote||state.checkoutQuote.productId!==p.id))state.checkoutQuote={productId:p.id,price:p.price}}commit()}
function mobileShare(id){const p=product(id);if(!p||!p.active||p.deleted||!p.commissionEnabled)return toast('该商品当前不可推广');state.product=id;state.shareScope='sku';makeLink();if(state.lastLink?.target===id){state.mobile.cardProduct=id;state.mobile.view='share';commit()}}
function mobileOpenCard(){const id=state.mobile.cardProduct||state.lastLink?.target;if(!id)return toast('先生成一张演示分享卡片');state.product=id;state.mobile.view='buy';openLink();commit()}
function mobileBuyProduct(id){const p=product(id);if(!p||p.deleted||!p.active)return toast('该商品当前不可购买');state.product=id;state.checkoutQuote={productId:id,price:p.price};state.mobile.view='buy';commit()}
function mobilePay(){refreshBusinessState();const id=pay();if(typeof id==='string'&&state.orders.some(o=>o.id===id)){if(!state.mobile.orderIds.includes(id))state.mobile.orderIds.push(id);state.mobile.view='orders';commit('模拟下单成功，可继续体验快递签收与确认收货');return id}}
function mobileOrderAction(id,action){const o=state.orders.find(o=>o.id===id);if(!o)return;if(action==='ship')ship(id,'演示快递服务商','DEMO-'+id);if(['in_transit','out_for_delivery','signed'].includes(action))logisticsEvent(id,action);if(action==='confirm')confirmReceipt(id);if(action==='pickup')redeemPickup(id);if(action==='observe'){state.day=Math.max(state.day,o.maturityDay);commit('已模拟经过售后服务期')} }
function mobileSettle(id){const o=state.orders.find(o=>o.id===id);if(!o)return;if(!fulfillmentReady(o))return toast('该单还未签收确认或提货核销，不能结佣');state.day=Math.max(state.day,o.maturityDay);settle(id)}
function mobilePersona(){return `<label class="m-persona">推广身份<select id="mobilePromoter">${state.people.filter(p=>p.level>0).map(p=>`<option value="${p.id}" ${state.promoter===p.id?'selected':''}>${esc(p.name)} · ${p.level===1?'一级':p.parentId?'直属二级':'独立二级'}${p.promotingFrozen?' · 待复核':''}</option>`).join('')}</select></label>`}
function mobileProduct(p,promote){const r=resolveRule(p.id);return `<div class="m-product">${art(p)}<div class="m-product-text"><h3>${esc(p.name)}</h3><p>${esc(p.spec)}</p><div class="m-price">${money(p.price)}</div>${promote?`<small>本人预估奖励 <b>${money(commission(p.price,0,r.bp))}</b> · ${percent(r.bp)}</small>`:'<small>DEMO样板门店 · 以当前页面为准</small>'}<button class="m-button ${promote?'':'light'}" ${promote?`data-mobile-share="${p.id}"`:`data-mobile-buy="${p.id}"`}>${promote?'生成专属演示卡片':'查看商品 / 购买'}</button></div></div>`}
function mobileShareView(){const eligible=promotableProducts(),card=state.mobile.cardProduct?product(state.mobile.cardProduct):null,approved=person(state.promoter)?.status==='已审核'&&!person(state.promoter)?.promotingFrozen;return `<div class="m-section"><div class="m-label">推广人视角</div><h2>选好物，分享给需要的人</h2><p class="m-muted">只显示在售且允许推广的商品。本人奖励以订单实付和售后结果为准。</p>${mobilePersona()}${!approved?'<div class="m-note">当前新推广资格尚未审核或已暂停，不能生成新推广卡片。</div>':''}</div><div class="m-section"><div class="m-section-title"><h3>可推广商品</h3><span>${eligible.length}款</span></div>${eligible.length?eligible.map(p=>mobileProduct(p,true)).join(''):'<div class="m-empty">暂无可推广商品。已停佣商品仍可在商城正常购买。</div>'}</div>${card?`<div class="m-section"><div class="m-label">已生成 · 演示分享卡片</div><div class="m-share-card">${art(card)}<h3>${esc(card.name)}</h3><p>${esc(card.spec)} · ${money(card.price)}</p><small>${esc(person(state.lastLink?.promoter||state.promoter)?.name||'')}推荐 · 仅演示效果</small></div><div class="m-buttons"><button class="m-button" data-action="mobileOpenCard">模拟客户打开</button><button class="m-button light" data-action="mobileCopyCard">复制演示说明</button></div><p class="m-footnote">未连接真实微信分享。这里用“模拟客户打开”体验商品与成交归属。</p></div>`:''}`}
function mobileBuyView(){const p=product(state.product),available=p&&!p.deleted&&p.active,other=state.products.filter(p=>p.active&&!p.deleted);return `<div class="m-section"><div class="m-label">消费者视角</div><h2>商品详情</h2><p class="m-muted">客户在商城正常选品、下单和收货。</p></div>${available?`<div class="m-section m-detail">${art(p)}<h2>${esc(p.name)}</h2><p class="m-muted">${esc(p.spec)}</p><div class="m-detail-price">${money(p.price)}</div><div class="m-field"><span>门店</span><b>DEMO样板门店</b></div><div class="m-field"><span>规格</span><b>${esc(p.spec)}</b></div><label class="m-field"><span>收货方式</span><select id="mobileFulfillment"><option value="express" ${state.fulfillment==='express'?'selected':''}>快递配送</option><option value="pickup" ${state.fulfillment==='pickup'?'selected':''}>到店自提</option></select></label><div class="m-field"><span>演示商品金额</span><b>${money(p.price)}</b></div><button class="m-button m-large" data-action="mobilePay">模拟下单 · ${money(p.price)}</button><p class="m-footnote">只模拟流程，无真实收款。售价变化时会提示重新确认；不可购买商品会被拦截。</p></div>`:'<div class="m-section"><div class="m-empty">该商品已下架或移除，原链接当前不能购买。</div></div>'}<div class="m-section"><h3>其他在售商品</h3>${other.filter(x=>!available||x.id!==p.id).map(x=>mobileProduct(x,false)).join('')||'<p class="m-muted">暂无其他商品</p>'}</div>`}

function scopeName(r){return r.scope==='sku'?product(r.target)?.name:r.scope==='series'?SERIES[r.target]:r.scope==='tag'?state.tags[r.target]:'未命中时默认'}
function matches(r,p){return r.enabled&&(r.scope==='default'||r.scope==='sku'&&r.target===p.id||r.scope==='series'&&r.target===p.series||r.scope==='tag'&&p.tags.includes(r.target))}
function resolveRule(pid,rules=state.rules,excluded=state.excluded){const p=product(pid);if(!p||p.deleted||!p.active||!p.commissionEnabled)return {bp:0,parentBp:0,name:!p?'商品不存在':p.deleted?'商品已移除':!p.active?'商品已下架':'该门店SKU未开启分佣',excluded:true};if(excluded.includes(pid))return {bp:0,name:'单品排除',excluded:true};const rank={sku:0,series:1,tag:2,default:3};const rs=rules.filter(r=>matches(r,p)).sort((a,b)=>rank[a.scope]-rank[b.scope]||a.priority-b.priority);if(!rs.length)return {bp:0,name:'无适用规则',excluded:true};if(rs[1]&&rank[rs[0].scope]===rank[rs[1].scope]&&rs[0].priority===rs[1].priority)return {bp:0,name:'规则冲突，禁止计佣',conflict:true};return {...rs[0],name:scopeName(rs[0])}}
function parseDecimal(raw,max){const text=String(raw).trim();if(!/^\d+(?:\.\d{1,2})?$/.test(text))return NaN;const n=Number(text);return Number.isFinite(n)&&n>=0&&n<=max?Math.round(n*100):NaN}
function parseInteger(raw,min,max){const text=String(raw).trim();if(!/^\d+$/.test(text))return NaN;const n=Number(text);return Number.isSafeInteger(n)&&n>=min&&n<=max?n:NaN}
function validateRules(rules,products=state.products){for(const r of rules){if(!Number.isInteger(r.bp)||r.bp<0||r.bp>10000||!Number.isInteger(r.parentBp)||r.parentBp<0||r.parentBp>10000)return '两项比例均须必填，0%至100%之间且最多两位小数';if(r.bp+r.parentBp>10000)return '直接推广与直属一级的比例合计不能超过100%';if(!Number.isInteger(r.priority)||r.priority<1||r.priority>999)return '优先级须为1至999的整数'}for(const p of products.filter(p=>!p.deleted)){const groups={};for(const r of rules.filter(r=>matches(r,p))){const key=r.scope+':'+r.priority;if(groups[key])return `${esc(p.name)}命中同层同优先级规则，请调整优先级或停用重叠规则`;groups[key]=r.id}}return ''}
function fulfillmentReady(o){return o.fulfillment==='express'?!!(o.logistics&&o.logistics.status==='signed'&&o.logistics.signedDay!==null&&o.logistics.confirmedDay!==null):!!(o.fulfillment==='pickup'&&o.pickup&&o.pickup.redeemedDay!==null)}
function due(o){return o.status==='completed'&&fulfillmentReady(o)&&!o.aftersaleOpen&&state.day>=o.maturityDay}
function pending(pid){return state.orders.filter(o=>o.status!=='settled'&&o.status!=='void').reduce((a,o)=>a+o.commissionLegs.filter(l=>l.recipientId===pid).reduce((n,l)=>n+l.amount,0),0)}
function frozen(pid){return state.withdrawals.filter(w=>w.promoter===pid&&['applied','approved'].includes(w.status)).reduce((a,w)=>a+w.amount,0)}
function earning(pid){return state.orders.reduce((a,o)=>a+o.commissionLegs.filter(l=>l.recipientId===pid).reduce((n,l)=>n+l.amount,0),0)}
function deposit(pid,amount){const w=wallet(pid),offset=Math.min(w.debt,amount);w.debt-=offset;w.available+=amount-offset}
function commission(paid,refund,bp){return Math.floor((paid-refund)*bp/10000)}
function makeLink(){refreshBusinessState();const p=person(state.promoter);if(p.status!=='已审核'||p.promotingFrozen)return toast('该推广人待审核，暂不能生成推广链接');const selected=product(state.product);if(!selected||selected.deleted||!selected.active||!selected.commissionEnabled||resolveRule(selected.id).excluded)return toast('该商品当前不可推广；停佣商品仍可正常购买');if(state.shareScope==='tag'&&!selected.tags.length)return toast('该商品尚无标签，请先选择其他分享范围');state.lastLink={promoter:p.id,scope:state.shareScope,target:state.shareScope==='sku'?selected.id:state.shareScope==='series'?selected.series:selected.tags[0],createdDay:state.day};log(`${esc(p.name)}生成${state.shareScope==='sku'?'商品':state.shareScope==='series'?'系列':'标签'}推广链接`);commit('已生成演示推广链接')}

function pay(){refreshBusinessState();const p=product(state.product);if(!p||p.deleted||!p.active)return toast('商品已下架或移除，当前链接不可购买');if(!state.checkoutQuote||state.checkoutQuote.productId!==p.id){state.checkoutQuote={productId:p.id,price:p.price};commit('请核对当前商品和价格，再次确认下单');return}if(state.checkoutQuote.price!==p.price){state.checkoutQuote={productId:p.id,price:p.price};commit('商品价格已更新，请核对新价格后再次确认下单');return}const r=resolveRule(p.id);if(r.conflict)return toast('规则冲突，请先在后台修正');const self=$('selfPurchase')?.checked||false;let promoter=null,reason='自然访问，无推广归属';if(state.visit){const v=state.visit;const inScope=v.scope==='sku'?p.id===v.target:v.scope==='series'?p.series===v.target:p.tags.includes(v.target);if(state.day-v.openedDay>=state.config.windowDays)reason='推广访问已过有效期';else if(!inScope)reason='商品不在当前推广链接范围';else if(!person(v.promoter)||person(v.promoter).status!=='已审核'||person(v.promoter).promotingFrozen)reason='推广资格未审核或已冻结，不产生新推广佣金';else if(self&&!state.config.selfAllowed)reason='推广人自购，本例不计佣';else if(r.excluded)reason=r.name;else{promoter=v.promoter;reason='有效期内最后有效链接归属，支付时锁定'}}const id='DM'+String(state.orders.length+1).padStart(4,'0'),direct=promoter?person(promoter):null,parent=direct?.level===2&&direct.parentId?person(direct.parentId):null,parentValid=parent?.level===1&&parent.status==='已审核',legs=[];if(direct){legs.push({recipientId:direct.id,kind:'direct',levelSnapshot:direct.level,parentIdSnapshot:direct.parentId||null,bp:r.bp,baseAmount:p.price,amount:commission(p.price,0,r.bp),settled:false});if(parentValid)legs.push({recipientId:parent.id,kind:'parent',levelSnapshot:1,parentIdSnapshot:null,childIdSnapshot:direct.id,bp:r.parentBp,baseAmount:p.price,amount:commission(p.price,0,r.parentBp),settled:false})}const o={id,product:p.id,productSnapshot:{id:p.id,name:p.name,spec:p.spec,price:p.price,series:p.series,tags:[...p.tags],tagNames:p.tags.map(t=>state.tags[t]||t),seriesName:SERIES[p.series],commissionEnabled:p.commissionEnabled,storeCode:p.storeCode},buyerAlia const LOG_STATUS={unshipped:'待发货',shipped:'已发货',in_transit:'运输中',out_for_delivery:'派送中',signed:'物流已签收',refused:'拒收待核实',returning:'退回中',exception:'配送异常'};

function fulfillmentLabel(o){if(o.fulfillment==='pickup')return o.pickup?.redeemedDay!==null?'已提货核销':'待门店提货核销';const l=o.logistics;return !l?'尚未建立物流记录':l.confirmedDay!==null&&l.status==='signed'?'物流签收 + 已确认收货':LOG_STATUS[l.status]||'待核实'}

function ship(id,carrier,tracking){refreshBusinessState();const o=state.orders.find(o=>o.id===id);if(!o||o.fulfillment!=='express')return toast('仅快递订单可发货');if(o.status==='void'||o.refund===o.paid)return toast('订单已全额退款，不能发货');const l=o.logistics;carrier=String(carrier||'').trim();tracking=String(tracking||'').trim().toUpperCase();if(!carrier||carrier.length>20||!/^DEMO-[A-Z0-9-]{4,28}$/.test(tracking))return toast('请填写快递公司及DEMO-开头的虚构单号，仅字母数字和横线');if(l.status!=='unshipped')return toast(l.carrier===carrier&&l.tracking===tracking?'相同发货记录已处理，不重复发货':'订单已有发货记录，变更单号须人工复核');l.carrier=carrier;l.tracking=tracking;l.status='shipped';addTrack(o,'SHIP-'+id,'模拟发货：包裹交寄，佣金仍锁定预估','模拟商城发货');log(`${id}模拟快递发货，未签收不结佣`);commit('已模拟发货，未签收前不结算本单佣金')}
function logisticsEvent(id,type,eventId,generation){refreshBusinessState();const o=state.orders.find(o=>o.id===id);if(!o||o.fulfillment!=='express')return toast('该单不是快递订单');const l=o.logistics;eventId=eventId||('LOG-'+id+'-'+type+'-G'+l.generation);if(l.events.includes(eventId))return toast('相同物流事件已处理，不重复记轨迹或结算');if(generation!==undefined&&generation!==l.generation)return toast('旧订阅批次事件，进入核对记录，不覆盖新状态');if(!l.carrier||l.status==='unshipped')return toast('尚未发货，不能直接收到签收或在途结果');if(EXCEPTIONS.includes(l.status))return toast('物流异常须先人工核实恢复，普通回调不能覆盖');if(EXCEPTIONS.includes(type)){l.exception={refused:'模拟收件拒收，待核实',returning:'模拟包裹退回中，待核实',exception:'模拟配送异常，待核实'}[type];l.status=type;if(o.status!=='settled'){l.confirmedDay=null;l.signedDay=null;if(o.status==='completed'){o.status='paid';delete o.completedDay;delete o.maturityDay}}addTrack(o,eventId,l.exception+'；不自动退款或回库');log(`${id}${LOG_STATUS[type]}，本单暂停完成与结佣`);return commit('已记录异常；未结算佣金继续锁定，不自动退款或回库')}
const previous={in_transit:'shipped',out_for_delivery:'in_transit',signed:'out_for_delivery'};if(!previous[type])return toast('不支持的物流状态');if(l.status===type)return toast('该物流状态已记录，不重复处理或改签收时间');if(l.status!==previous[type])return toast('物流步骤不匹配，不能跳过发货、在途或派送');l.status=type;if(type==='signed'){l.signedDay=state.day;if(l.rawSignedDay===null)l.rawSignedDay=state.day}addTrack(o,eventId,{in_transit:'包裹运输中，佣金仍锁定预估',out_for_delivery:'包裹派送中，佣金仍锁定预估',signed:'物流已签收，仍需客户确认收货；不立即分钱'}[type]);log(`${id}${LOG_STATUS[type]}，本单尚未进入可提现`);commit(type==='signed'?'物流已签收，等待客户确认收货；本单尚不可提现':'轨迹已更新，本单佣金继续锁定')}
function confirmReceipt(id){refreshBusinessState();const o=state.orders.find(o=>o.id===id);if(!o||o.fulfillment!=='express')return toast('请对快递订单确认收货');const l=o.logistics;if(o.status==='settled')return toast('历史订单已结算，后续异常走原单售后，不重新结佣');if(l.status!=='signed'||l.signedDay===null)return toast('须先物流签收且无待核实异常，再由客户确认收货');if(l.confirmedDay!==null){if(o.status==='paid'&&fulfillmentReady(o))return complete(id);return toast('客户已确认收货，不延后结算日期或重复计佣')}l.confirmedDay=state.day;addTrack(o,'RECEIPT-'+id+'-G'+l.generation,'模拟客户确认收货，开始售后观察','模拟客户确认');complete(id)}
function redeemPickup(id){refreshBusinessState();const o=state.orders.find(o=>o.id===id);if(!o||o.fulfillment!=='pickup')return toast('该单不是门店自提');if(o.status==='settled')return toast('提货码已核销，不重复完成或计佣');if(o.pickup.redeemedDay!==null){if(o.status==='paid'&&fulfillmentReady(o))return complete(id);return toast('提货码已核销，不重复完成或计佣')}if(o.status!=='paid')return toast('当前订单不能核销');o.pickup.redeemedDay=state.day;log(`${id}模拟员工扫描演示提货码，完成自提`);complete(id)}
function recoverLogistics(id){refreshBusinessState();const o=state.orders.find(o=>o.id===id),l=o?.logistics;if(!l||!EXCEPTIONS.includes(l.status))return toast('当前无需异常恢复');l.generation++;l.status='in_transit';l.exception='';if(o.status!=='settled'){l.signedDay=null;l.confirmedDay=null}addTrack(o,'MANUAL-'+id+'-G'+l.generation,'人工核实后恢复运输；后续须重新派送、签收及确认','模拟人工复核');log(`${id}物流异常人工核实后恢复，订阅批次更新`);commit('已记录人工恢复，旧批次事件不能覆盖；尚未重新结佣')}
function complete(id){refreshBusinessState();const o=state.orders.find(o=>o.id===id);if(o.status!=='paid')return toast('该订单已处理，不重复确认');if(!fulfillmentReady(o))return toast(o.fulfillment==='express'?'快递须物流签收并确认收货，不能跳过中途结佣':'自提须提货码核销，不能手工跳过完成');if(o.aftersaleOpen)return toast('售后仍在处理中，暂不能完成进入结算');o.status='completed';o.completedDay=o.fulfillment==='express'?o.logistics.confirmedDay:o.pickup.redeemedDay;o.maturityDay=o.completedDay+o.afterDays;log(`${id}完成${o.fulfillment==='express'?'快递收货':'自提核销'}，${o.afterDays}天售后观察期开始`);commit('收货条件已满足，仍需售后观察期结束才可结佣')}

function validateCommissionLegs(o){if(!Array.isArray(o.commissionLegs))return '缺少收款明细';const seen=new Set();let sum=0;for(const l of o.commissionLegs){if(seen.has(l.recipientId)||!state.wallets[l.recipientId]||!person(l.recipientId))return '收款人重复或钱包不存在';seen.add(l.recipientId);if(!Number.isSafeInteger(l.bp)||l.bp<0||l.bp>10000||!Number.isSafeInteger(l.amount)||l.amount<0||l.baseAmount!==o.paid||l.amount!==commission(o.paid,o.refund,l.bp))return '原单比例或金额快照异常';if(l.kind==='direct'?l.recipientId!==o.promoter:l.kind==='parent'?l.recipientId!==o.parentIdSnapshot:true)return '原单收款关系异常';sum+=l.amount}return sum!==o.commission?'收款明细合计与订单不符':''}
function settle(id){refreshBusinessState();const o=state.orders.find(o=>o.id===id);if(o.aftersaleOpen)return toast('该订单售后仍在处理中，暂缓结算');if(!fulfillmentReady(o))return toast('履约条件未满足：快递签收并确认收货，或自提核销后才允许结算');if(!due(o))return toast(o.status==='settled'?'该订单已结算，不会重复入账':'尚未满足结算条件');if(validateCommissionLegs(o)||o.commissionLegs.some(l=>l.settled))return toast('收款明细、合计或状态异常，整单暂不入账，请人工核对');for(const l of o.commissionLegs){deposit(l.recipientId,l.amount);l.settled=true;l.settledAmount=l.amount}o.status='settled';o.settledDay=state.day;log(`${id}同一结算批次将${o.commissionLegs.length}笔佣金入账，合计${money(o.commission)}`);commit('全部收款明细同时结佣，重复结算不再次入账')}
function refund(id,amount,refundId){refreshBusinessState();const o=state.orders.find(o=>o.id===id);o.refundEvents=o.refundEvents||[];const eventId=refundId||('RF'+String(o.refundEvents.length+1));if(o.refundEvents.some(x=>x.id===eventId))return toast('同一退款业务已处理，重复通知不重复扣佣');if(!Number.isInteger(amount)||amount<=0||amount>o.paid-o.refund)return toast('退款金额须大于0，且不能超过未退金额');if(validateCommissionLegs(o))return toast('原单收款明细异常，本次退款佣金整笔暂不处理');o.refundEvents.push({id:eventId,amount});const oldTotal=o.commission;o.refund+=amount;for(const l of o.commissionLegs){const old=l.amount;l.amount=commission(o.paid,o.refund,l.bp);const claw=old-l.amount;if(o.status==='settled'&&claw>0){const w=wallet(l.recipientId),cut=Math.min(w.available,claw);w.available-=cut;w.debt+=claw-cut}}o.commission=o.commissionLegs.reduce((a,l)=>a+l.amount,0);if(o.refund===o.paid&&o.status!=='settled')o.status='void';log(`${id}退款${money(amount)}，按原单各自比例调减佣金合计${money(oldTotal-o.commission)}`);commit('按原快照分别冲回各收款人；改绑和新规则不改变旧单')}
function withdraw(){refreshBusinessState();const pid=state.promoter,w=wallet(pid);if(!person(pid)||person(pid).level===0)return toast('该消费者尚未成为推广人，不能申请提现');const amount=parseDecimal($('withdrawAmount')?.value,100000);if(!Number.isInteger(amount)||amount<state.config.minWithdraw)return toast(`本例单次至少${money(state.config.minWithdraw)}`);if(w.debt>0)return toast('存在待抵扣佣金，暂不能申请提现');if(amount>w.available)return toast('可提现余额不足');w.available-=amount;const id='WD'+String(state.withdrawals.length+1).padStart(3,'0');state.withdrawals.unshift({id,promoter:pid,amount,status:'applied',day:state.day});log(`${id}提交模拟提现申请${money(amount)}，金额已冻结`);commit('提现申请已生成，金额冻结等待审核')}
function updateWithdraw(id,next){refreshBusinessState();const w=state.withdrawals.find(x=>x.id===id);const valid={applied:['approved','rejected'],approved:['paid','failed']};if(!(valid[w.status]||[]).includes(next))return toast('该申请当前状态不支持此操作，不重复处理');if(['approved','paid'].includes(next)&&wallet(w.promoter).debt>0)return toast('该推广人存在待抵扣，须先处理异常再审核或打款');w.status=next;if(['rejected','failed'].includes(next))deposit(w.promoter,w.amount);if(next==='paid')wallet(w.promoter).paid+=w.amount;log(`${id}${{approved:'审核通过，等待付款',rejected:'驳回并释放冻结',paid:'模拟已打款',failed:'模拟付款失败并释放冻结'}[next]}`);commit(next==='paid'?'仅模拟已打款，无真实资金操作':'状态已更新，同一申请不重复返还金额')}
function stats(){const pid=state.promoter,w=wallet(pid);return `<div class="grid4"><div class="metric red"><label>可提现佣金</label><strong>${money(w.available)}</strong><small>已结算且未冻结的金额</small></div><div class="metric"><label>待结算</label><strong>${money(pending(pid))}</strong><small>待履约 / 售后观察 / 待结算</small></div><div class="metric"><label>提现冻结中</label><strong>${money(frozen(pid))}</strong><small>申请中 / 审核通过待付款</small></div><div class="metric"><label>${w.debt?'待抵扣佣金':'累计模拟打款'}</label><strong>${money(w.debt||w.paid)}</strong><small>${w.debt?'退款后不足冲回，暂停提现':'全为演示，不代表实际到账'}</small></div></div>`}
function phone(){const w=wallet(state.promoter);return `<div class="phone"><div class="phone-top"><span>9:41</span><span>●●● ▰</span></div><div class="phone-head"><small>便民欢 · 推广中心</small><h3>分享好物，成交有奖励</h3><p>${person(state.promoter).name} · ${person(state.promoter).status}</p></div><div class="phone-body"><div class="wallet"><p>可提现佣金（示例）</p><div class="big">${money(w.available)}</div><p>未签收前本单只锁定预估</p></div><div class="phone-grid"><div><b>${money(pending(state.promoter))}</b><small>待结算佣金</small></div><div><b>${state.orders.filter(o=>o.promoter===state.promoter).length}</b><small>直接推广订单</small></div></div><button class="btn red" data-go="promoter">选商品 · 生成推广链接</button><button class="btn" data-go="settlement">佣金明细 / 提现申请</button><div class="phone-row"><span>商品、系列、标签</span><b>均可配置比例</b></div><div class="phone-row"><span>签收 + 确认 → 观察期结束</span><b>再结算</b></div></div><div class="phone-bottom">场景样板 · 非真实小程序</div></div>`}
function selectPerson(){return `<label class="field">当前推广人<select id="promoterSelect">${state.people.map(p=>`<option value="${p.id}" ${state.promoter===p.id?'selected':''}>${esc(p.name)} · ${p.level===1?'一级':p.level===2?(p.parentId?'直属二级':'独立二级'):'消费者'} · ${p.status}</option>`).join('')}</select></label>`}
function overview(){return `<div class="hero"><div class="hero-story"><div class="eyebrow">商城最终需求评审 / 推广分佣</div><h1>别人帮我们卖，<br>成交后给他结佣。</h1><p class="intro">为指定推广人生成带归属标识的商品、系列或标签链接。二级B带来100元有效商品实付，B与其直属一级A各预估5元；一级直推或独立二级只得本人5元，均为模拟规则。客户进商城下单，快递物流签收并确认收货，过售后观察期后，佣金才能转入可提现账户。中途只锁定预估佣金，不分钱。</p><div class="hero-stat"><div><strong>3种</strong><small>商品 / 系列 / 标签</small></div><div><strong>2级</strong><small>直属关系 · 无第三级</small></div><div><strong>独立账</strong><small>佣金与购物余额分开</small></div></div><div class="actions"><button class="btn red" data-go="share">体验一次分享成交 →</button><button class="btn" data-go="rules">看后台怎么配置</button></div><div class="step-flow">${[['01','审核推广人','谁可以参与推广'],['02','分享专属链接','标识推广人和范围'],['03','客户下单','支付锁定关系和比例'],['04','签收并确认收货','中途不分钱'],['05','售后结束再提现','结佣、冻结、审核、付款']].map(x=>`<div class="flow-step"><span>${x[0]}</span><b>${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div><div class="info">所有比例和期限均为方便评估的示例。当前页面只保存本机演示状态，不与已上线商城、收银或微信支付连接。</div></div>${phone()}</div><div class="page-section grid3"><div class="card"><div class="mini-label">对推广人</div><h3>知道分享什么、能赚多少</h3><p class="sub">展示可推广商品、当前比例和预估奖励，区分待结算、可提现与冻结金额。</p></div><div class="card"><div class="mini-label">对运营</div><h3>一个商品，或一组商品</h3><p class="sub">单品单独定佣，也可按系列、标签批量设置，保留暂停推广和商品排除。</p></div><div class="card"><div class="mini-label">对开发</div><h3>订单、佣金、提现可追溯</h3><p class="sub">归因记录、规则快照、退款重算与提现流水分开，避免重复结佣和重复返还。</p></div></div>`}
function promoter(){return `<div class="section-top"><div><div class="eyebrow">推广人端</div><h2>我的推广中心</h2><p class="intro">已审核推广人查看可推广商品和自己的佣金；两级各5%为示例。切换演示账户不等于真实授权，隔离效果请看角色权限预览。</p></div>${selectPerson()}</div>${stats()}<div class="page-section"><h3>选择一款，分享给需要的人</h3><div class="grid3">${promotableProducts().map(p=>{const r=resolveRule(p.id);return `<div class="card product-card">${art(p)}<h3 class="product-title">${esc(p.name)}</h3><p class="sub">${esc(p.spec)}</p><div class="product-line"><span class="price">${money(p.price)}</span><span class="reward">${r.excluded?'暂不计佣':`比例 ${percent(r.bp)}`}</span></div><p class="sub">预估奖励 <b class="strong-red">${money(commission(p.price,0,r.bp))}</b> / 份</p><button class="btn red space-top" data-share-product="${p.id}" ${(person(state.promoter).status!=='已审核'||person(state.promoter).promotingFrozen)?'disabled':''}>生成推广链接</button></div>`}).join('')}</div></div><div class="info">预估奖励不是可提现余额：支付、发货、运输和派送途中只锁定预估。快递须物流签收并确认收货，再过售后观察期；到店自提须提货码核销。实际按退款后的有效实付计佣。</div>`}
function share(){const p=product(state.product),r=resolveRule(p.id),l=state.lastLink,v=state.visit;const path=l?`/pages/${l.scope==='sku'?'product/detail':'campaign/list'}?${l.scope}=${l.target}&ref=${l.promoter}`:'';return `<div class="section-top"><div><div class="eyebrow">从链接到订单</div><h2>亲手走一次分享成交</h2><p class="intro">先生成链接，再打开客户视角，最后模拟下单。可以切换推广人，比较最后有效链接的归属。</p></div><button class="btn" data-go="settlement">查看结算与提现 →</button></div><div class="simulation-banner"><div><b>演示时钟 · ${date(state.day)}</b><br><small>每次推进只改变本机样板日期</small></div><button class="btn soft" data-action="day">推进1天</button></div><div class="grid2"><div class="card"><span class="pill">01 · 推广人生成链接</span><div class="form-grid">${selectPerson()}<label class="field">推广商品<select id="productSelect">${state.products.filter(p=>p.active&&!p.deleted).map(p=>`<option value="${p.id}" ${state.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field wide">分享范围<select id="scopeSelect"><option value="sku" ${state.shareScope==='sku'?'selected':''}>单个商品</option><option value="series" ${state.shareScope==='series'?'selected':''}>这个商品所属系列</option><option value="tag" ${state.shareScope==='tag'?'selected':''}>这个商品的首个标签</option></select></label></div><div class="actions"><button class="btn red" data-action="makeLink">生成演示推广链接</button></div>${l?`<div class="code space-top">${esc(path)}</div><p class="sub">${person(l.promoter).name} · ${esc(l.scope==='sku'?product(l.target).name:l.scope==='series'?SERIES[l.target]:state.tags[l.target])} · 演示路径</p><div class="actions"><button class="btn" data-action="copyLink">复制路径说明</button><button class="btn dark" data-action="openLink">模拟客户打开链接</button></div>`:'<div class="empty space-top">生成后可看到带推广人标识的路径</div>'}<div class="info">真实小程序需由开发实现分享卡片 / 小程序码及服务端归因，本网页复制的是说明用演示路径。</div></div><div class="card"><span class="pill">02 · 客户在商城购买</span><div class="space-top">${art(p)}</div><h3 class="space-top">${esc(p.name)}</h3><p class="sub">${esc(p.spec)} · 商城统一收款，门店履约</p><div class="product-line"><span class="price">${money(p.price)}</span><span class="reward">当前比例 ${percent(r.bp)}</span></div><div class="rowline"><span>有效推广访问</span><b>${v?person(v.promoter).name:'尚未打开链接'}</b></div><div class="rowline"><span>本次访问期限</span><span>${v?date(v.openedDay)+' 至 '+date(v.openedDay+state.config.windowDays)+'前':'—'}</span></div><label class="field space-top">收货方式<select id="fulfillmentSelect"><option value="express" ${state.fulfillment!=='pickup'?'selected':''}>快递配送 · 签收并确认收货</option><option value="pickup" ${state.fulfillment==='pickup'?'selected':''}>到店自提 · 提货码核销</option></select></label><div class="info">本单支付后仅锁定预估佣金；未签收或未核销前，本单可提现金额为0。</div><label class="check space-top"><input type="checkbox" id="selfPurchase">模拟推广人自购（默认不计佣）</label><button class="btn red space-top" data-action="pay">模拟支付 ${money(p.price)}</button><p class="sub">支付时冻结直接推广人、直属一级、有效商品实付、两项比例和规则版本；改绑或改规则不追溯旧单。</p></div></div><div class="page-section"><h3>最近一笔演示订单</h3>${state.orders.length?orderCard(state.orders[state.orders.length-1]):'<div class="empty">完成模拟支付后，这里显示归属和预估佣金。</div>'}</div>`}

function rules(){return `<div class="section-top"><div><div class="eyebrow">运营后台样板</div><h2>按商品、系列或标签设置比例</h2><p class="intro">保存到本机演示。真实系统应由运营权限控制，审核发布并保留改动记录。</p></div><button class="btn red" data-action="saveRules">保存本机规则</button></div><div class="card"><h3>规则命中顺序</h3><div class="rules-priority"><span>单商品排除</span><b>优先</b><span>单商品比例</span><b>›</b><span>系列比例</span><b>›</b><span>标签比例</span><b>›</b><span>默认比例</span></div><p class="sub">同层按优先级数字从小到大选择；同优先级重叠拦保存。每种收款角色只取一条规则；两项合计不超100%。0%有效，不因未产生上级佣金而转给别人。</p><div class="table-wrap space-top"><table><thead><tr><th>启用</th><th>范围</th><th>匹配对象</th><th>直接推广比例</th><th>直属一级比例</th><th>优先级</th><th>操作</th></tr></thead><tbody>${ruleRows()}</tbody></table></div><div class="form-grid"><label class="field">新增规则范围<select id="newScope"><option value="sku">单商品</option><option value="series">商品系列</option><option value="tag">商品标签</option><option value="default">默认</option></select></label><label class="field">规则对象<select id="newTarget">${state.products.filter(p=>p.active&&!p.deleted).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">比例（%）<input id="newPercent" type="number" min="0" max="100" step="0.01" value="5"></label><label class="field">直属一级比例（%）<input id="newParentPercent" type="number" min="0" max="100" step="0.01" value="5"></label><label class="field">优先级（数字小优先）<input id="newPriority" type="number" min="1" max="999" value="20"></label><div class="field" style="justify-content:end"><button class="btn" data-action="addRule">加入规则并校验</button></div></div><div class="info">保存后只影响新订单。已支付订单继续使用原规则快照。新增系列或标签时，应重新检查其商品范围与规则重叠。</div></div><div class="grid2 space-top"><div class="card"><h3>结算与归因参数</h3><div class="form-grid"><label class="field">链接归因窗口（天）<input id="windowDays" type="number" min="1" max="30" value="${state.config.windowDays}"></label><label class="field">确认收货后观察（天）<input id="afterDays" type="number" min="0" max="90" value="${state.config.afterDays}"></label><label class="field">最低提现（元）<input id="minWithdraw" type="number" min="0.01" max="100000" step="0.01" value="${state.config.minWithdraw/100}"></label><label class="check field wide"><input id="selfAllowed" type="checkbox" ${state.config.selfAllowed?'checked':''}>允许自购计佣（示例默认关闭）</label></div><p class="sub">本例创建订单即模拟支付，须在窗口内完成；有效期内最后有效链接在支付时锁定当前订单；不永久绑定客户，不因分享链接自动获得客户个人资料。新老客均可，待业务确认。</p></div><div class="card"><h3>单品排除与命中预览</h3>${state.products.map(p=>{const r=resolveRule(p.id);return `<div class="rowline"><label class="check"><input class="excludeProduct" type="checkbox" value="${p.id}" ${state.excluded.includes(p.id)?'checked':''}>排除 ${esc(p.name)}${p.deleted?'（已移除）':!p.active?'（已下架）':''}</label><span>${r.excluded?r.name:'直推'+percent(r.bp)+' / 一级'+percent(r.parentBp)+' · '+esc(r.name)}</span></div>`}).join('')}<div class="actions"><button class="btn red" data-action="saveRules">保存规则和参数</button></div><p class="sub">“排除”优先于所有比例；限时活动、低毛利商品可以单独停用推广。</p></div></div>`}
function orderStatus(o){if(o.status==='paid')return o.fulfillment==='express'?fulfillmentLabel(o)+' · 预估锁定':'待提货核销 · 预估锁定';if(o.aftersaleOpen&&o.status!=='settled')return '售后处理中 · 暂缓结算';return o.status==='void'?'全额退款 · 已失效':o.status==='settled'?'已结算':o.status==='paid'?'待履约':due(o)?'可结算':'售后观察'}
function orderCard(o){return `<div class="card"><div class="section-top" style="margin-bottom:5px"><div><span class="mini-label">${o.id} · ${date(o.createdDay)} · 演示订单</span><h3>${esc(orderProduct(o).name)}</h3></div><span class="status ${o.status==='settled'?'green':o.status==='void'?'gray':''}">${orderStatus(o)}</span></div><div class="grid2"><div><div class="rowline"><span>归属推广人</span><b>${o.promoter?person(o.promoter).name:'无推广归属'}</b></div><p class="sub">${esc(o.reason)}</p><p class="sub">原商品规格：${esc(orderProduct(o).spec)} · 原标签：${(orderProduct(o).tagNames||[]).map(esc).join(' / ')||'按支付时快照'}</p><div class="rowline"><span>履约方式 / 状态</span><b>${o.fulfillment==='express'?'快递 · ':'自提 · '}${fulfillmentLabel(o)}</b></div><div class="rowline"><span>商品实付 / 累计退款</span><span>${money(o.paid)} / ${money(o.refund)}</span></div><div class="rowline"><span>支付时冻结关系</span><b>直接${o.promoter?person(o.promoter).name:'无'} / 一级${o.parentIdSnapshot?person(o.parentIdSnapshot).name:'无'}</b></div><p class="sub">原规则：${esc(o.ruleName)} · 不含运费、充值交易和赠金支付；本金用于购货可按规则计佣</p></div><div><div class="calc"><p>各收款人分别按商品有效实付 × 原单比例，取整到分</p><strong>${money(o.commission)}</strong><p>${o.commissionLegs.map(l=>`${person(l.recipientId).name}（${l.kind==='parent'?'直属一级':'直接推广'}）${percent(l.bp)} = ${money(l.amount)}`).join('<br>')||'无有效推广收款人'}</p><p><b>${o.status==='settled'?'已按最终条件结算；后续退款按原单冲回':'本单仍锁定预估佣金，可提现为 ¥0.00'}</b></p></div><p class="sub">${o.completedDay!==undefined?`履约完成 ${date(o.completedDay)}；售后观察${o.afterDays}天；${date(o.maturityDay)}起可结算`:'快递签收并确认收货（自提须核销）后，才开始售后观察期'}</p></div></div><div class="actions">${['paid','completed'].includes(o.status)?`<button class="btn" data-aftersale="${o.id}">${o.aftersaleOpen?'模拟售后处理完成':'模拟售后处理中'}</button>`:''}${o.status==='paid'?o.fulfillment==='express'?`<button class="btn dark" data-go="logistics">查看快递履约 / 签收</button>`:`<button class="btn dark" data-pickup="${o.id}">模拟提货码核销</button>`:''}${o.status==='completed'?`<button class="btn red" data-settle="${o.id}" ${due(o)?'':'disabled'}>结算本单佣金</button><button class="btn" data-mature="${o.id}">推进到售后期结束</button>`:''}${o.status==='settled'?`<button class="btn" data-settle="${o.id}">验证重复结算</button>`:''}${o.refundEvents?.length?`<button class="btn" data-repeat-refund="${o.id}">验证重复退款通知</button>`:''}${o.refund<o.paid?`<button class="btn" data-refund20="${o.id}">模拟退款 ${money(Math.min(2000,o.paid-o.refund))}</button><button class="btn" data-refundall="${o.id}">模拟退剩余全款</button>`:''}</div></div>`}
function settlement(){const pid=state.promoter,w=wallet(pid);return `<div class="section-top"><div><div class="eyebrow">佣金与资金</div><h2>签收确认后，观察期结束才结佣</h2><p class="intro">运营后台演示可查看全部虚构订单；推广人端请进入角色权限预览。示例售后观察${state.config.afterDays}天。支付、发货和运输途中只锁定预估，本单不分钱。快递签收并确认收货（自提须核销）、无未结售后且观察期结束，才可结佣。全程只模拟。</p></div>${selectPerson()}</div>${stats()}${w.debt?`<div class="info rose">当前有${money(w.debt)}待抵扣：来源于已结算订单退款且剩余可提现不足。后续结算或申请释放金额优先抵扣；新申请、审核和打款暂停，需完成异常核对。</div>`:''}<div class="grid2 space-top"><div class="card"><h3>提现申请</h3><p class="sub">当前：${person(pid).name}。金额提交后冻结，审核通过后等待付款。</p><div class="inline-field space-top"><label for="withdrawAmount">申请金额（元）</label><input id="withdrawAmount" type="number" min="0.01" step="0.01" value="${Math.min(1000,w.available)/100}" style="width:130px"><button class="btn red" data-action="withdraw">模拟申请提现</button></div><p class="sub">示例最低${money(state.config.minWithdraw)}，不高于可提现；实际收款方式、手续费、付款能力及财税处理另行确认。</p><div class="info">佣金账户是独立应付记录。不会进入商城购物余额，也不会自动从会员充值账户转钱。</div></div><div class="card"><h3>提现审核与结果</h3>${state.withdrawals.filter(x=>x.promoter===pid).length?state.withdrawals.filter(x=>x.promoter===pid).map(x=>`<div class="space-top"><div class="rowline"><b>${x.id} · ${money(x.amount)}</b><span class="status">${{applied:'申请中 · 已冻结',approved:'审核通过 · 待付款',paid:'模拟已打款',rejected:'已驳回 · 已释放',failed:'付款失败 · 已释放'}[x.status]}</span></div><div class="actions">${x.status==='applied'?`<button class="btn small dark" data-wd="${x.id}" data-next="approved">审核通过</button><button class="btn small" data-wd="${x.id}" data-next="rejected">驳回申请</button>`:x.status==='approved'?`<button class="btn small red" data-wd="${x.id}" data-next="paid">模拟打款成功</button><button class="btn small" data-wd="${x.id}" data-next="failed">模拟付款失败</button>`:`<button class="btn small" data-wd="${x.id}" data-next="${x.status}">验证不重复处理</button>`}</div></div>`).join(''):'<div class="empty space-top">提交申请后，查看冻结、审核与结果。</div>'}</div></div><div class="page-section"><h3>运营后台 · 全部演示订单 / 收款明细</h3>${state.orders.length?[...state.orders].reverse().map(orderCard).join(''):'<div class="empty">还没有演示订单。<button class="text-link" data-go="share">去分享成交演示 →</button></div>'}</div><div class="card space-top"><h3>本机操作记录</h3>${state.logs.length?`<div class="timeline">${state.logs.slice(0,12).map(x=>`<div class="timeline-item"><b>${esc(x.text)}</b><small>${date(x.day)} · 演示记录</small></div>`).join('')}</div>`:'<p class="sub">生成链接、支付、完成、退款、结算和提现都会留下演示记录。</p>'}</div>`}
const REQUIREMENTS=`便民欢两级分销新增功能需求（已纳入商城最终需求评审，参数模拟；新增范围、费用与工期待确认）\n1. A/E为一级、B直属A的二级、C独立二级、D普通消费者。二级仅能绑定一个已审核一级或独立，禁止三级、自绑和循环。\n2. 佣金基数为有效商品实付（非利润），扣优惠和退款，不含运费、充值交易及赠金支付；本金用于购货可按规则计佣。\n3. B成交100元，本人5%与支付时直属一级5%各5元，仅演示；A直接成交本人5%，C独立二级本人5%，不虚构另一份佣金。商品/系列/标签/默认可配两列比例，各角色不叠加，合计不超100%，0%有效。\n4. 支付冻结归属、父子关系、比例、基数和规则快照；之后改绑或改规则不追溯旧单。单单保存多个独立收款明细，分别取整到分。\n5. 发货、运输、派送途中双方均只锁定预估，不分钱。快递物流签收+客户确认收货（自提须核销）、无未结售后且观察期结束，才同一批次结佣。\n6. 退款按原单各腿重算，各自钱包冲回、不足各自待抵扣暂停提现；退款业务ID、结算、付款和释放均防重复。自动结佣进入佣金余额不等于自动银行卡提现。\n7. A/E只见本人直接脱敏订单、直属名单和来自直属的本人佣金汇总，不见二级买家订单号/商品明细/姓名电话地址或成本。B/C只见本人直接脱敏订单。真实系统须服务端鉴权和字段过滤。\n8. D消费达门槛模拟初始关闭、门槛1000元仅示例；只累计当前指定一级入口已完成商品净消费，不混不同一级，不因消费升级发佣金。启用达标后D成为该一级的二级并记快照；改配置不改旧归属。原单重复不加、退款去重不超额。退款资格不足先冻结新推广并人工复核，已支付历史佣金不变。\n9. 推广层级收益及消费资格政策需独立业务、法务和平台能力审核；本样板不宣称已获许可。真实快递和商家转账接入资格/权限/账号/费用另评。\n10. 全为本机虚构数据，非真实登录、交易或转账；已作为商城最终需求评审模块，真实接入与验收待开发。`;


function bindPromoter(childId,parentId){refreshBusinessState();const child=person(childId),parent=parentId?person(parentId):null;if(!child||child.level!==2)return toast('仅二级可设置直属一级；一级不能绑定别人形成更深层级');if(parentId===childId)return toast('不能绑定自己');if(parentId&&(!parent||parent.level!==1||parent.status!=='已审核'))return toast('上级须为已审核一级，不能绑定二级或产生第三级');const before=child.parentId||null;if(before===(parentId||null))return toast('绑定关系未变化');child.parentId=parentId||null;state.bindings.unshift({day:state.day,childId,before,after:child.parentId});log(`后台将二级${child.name}改绑至${parent?parent.name:'独立无上级'}，只影响新支付订单`);commit('绑定已更新；已支付订单沿用原关系快照')}
function upgradeSpend(parentId){return state.upgrade.purchases.filter(x=>x.parentId===parentId).reduce((a,x)=>a+x.amount-x.refund,0)}
function evaluateUpgrade(parentId){const d=person('P004'),u=state.upgrade;if(!u.enabled||d.level!==0||parentId!==u.entryParent||upgradeSpend(parentId)<u.threshold)return false;d.level=2;d.parentId=parentId;d.status='已审核';d.promotingFrozen=false;u.qualification={parentId,threshold:u.threshold,day:state.day};u.records.unshift({day:state.day,type:'自动成为二级（模拟）',parentId,amount:upgradeSpend(parentId),threshold:u.threshold});log(`D在一级${person(parentId).name}入口有效消费达到模拟门槛，成为其直属二级；本次升级不发佣金`);return true}
function setUpgradeConfig(config){refreshBusinessState();const threshold=config.threshold,entry=person(config.entryParent);if(!Number.isSafeInteger(threshold)||threshold<=0||threshold>10000000)return toast('消费门槛须为大于0且不超过10万元的整数分');if(!entry||entry.level!==1||entry.status!=='已审核')return toast('升级入口只可选择已审核一级，不能通过二级形成第三级');state.upgrade.enabled=!!config.enabled;state.upgrade.threshold=threshold;state.upgrade.entryParent=entry.id;evaluateUpgrade(entry.id);log('保存模拟升级条件；不变更已经升级的历史绑定');commit('消费门槛全部为模拟参数；已升级关系保持原快照')}
function addUpgradeSpend(parentId,amount,businessId){refreshBusinessState();const u=state.upgrade,entry=person(parentId);businessId=String(businessId||'').trim();if(!entry||entry.level!==1||entry.status!=='已审核')return toast('仅一级入口消费可纳入本示例，二级入口不能生成第三级');if(!Number.isSafeInteger(amount)||amount<=0||!businessId||!/^[A-Z0-9_-]{3,30}$/i.test(businessId))return toast('请填写正数金额及3至30位演示原单号');if(u.purchases.some(x=>x.businessId===businessId))return toast('原单号已处理，重复记录不增加有效消费');u.purchases.push({businessId,parentId,amount,refund:0,day:state.day,refundEvents:[]});const promoted=evaluateUpgrade(parentId);log(`D新增模拟已完成商品消费${money(amount)}，一级${entry.name}入口；不产生推广佣金`);commit(promoted?'D达到模拟门槛，已成为对应一级下的二级':'已记录模拟净消费，未直接发放任何佣金')}
function refundUpgradeSpend(businessId,amount,refundId){refreshBusinessState();const u=state.upgrade,x=u.purchases.find(x=>x.businessId===businessId),d=person('P004');if(!x)return toast('未找到原消费记录');refundId=String(refundId||'UPRF-'+(x.refundEvents.length+1));if(x.refundEvents.includes(refundId))return toast('相同资格消费退款已处理，不重复扣减');if(!Number.isSafeInteger(amount)||amount<=0||amount>x.amount-x.refund)return toast('退款不能超过原单尚未退款的金额');x.refund+=amount;x.refundEvents.push(refundId);const q=u.qualification;if(q&&d.level===2&&q.parentId===x.parentId&&upgradeSpend(q.parentId)<q.threshold){d.promotingFrozen=true;d.status='待复核';u.records.unshift({day:state.day,type:'退款后冻结新推广，待人工核实',parentId:q.parentId,amount:upgradeSpend(q.parentId),threshold:q.threshold})}log(`D资格消费${businessId}退款${money(amount)}，旧推广订单佣金快照不变`);commit('净消费已扣回；资格不足先冻结新推广，不重算历史佣金')}
function reviewUpgrade(){refreshBusinessState();const u=state.upgrade,d=person('P004'),q=u.qualification;if(!q||!d.promotingFrozen)return toast('当前没有冻结资格待复核');if(upgradeSpend(q.parentId)<q.threshold)return toast('仍低于原模拟门槛，先保持冻结，正式处理规则待运营确认');d.promotingFrozen=false;d.status='已审核';u.records.unshift({day:state.day,type:'模拟人工复核恢复新推广',parentId:q.parentId,amount:upgradeSpend(q.parentId),threshold:q.threshold});commit('模拟复核已恢复新推广，历史订单不变')}
function maskPhone(value){const raw=String(value||'');const digits=raw.replace(/\D/g,'');return /^1\d{10}$/.test(digits)?digits.slice(0,3)+'****'+digits.slice(-4):raw.includes('*')?raw:'手机号已隐藏'}
function maskBuyerName(value){const raw=String(value||'');return /[＊*]/.test(raw)?raw.slice(0,15):raw?raw.slice(0,1)+'＊':'客户＊'}
function projectRole(id){if(id==='admin')return {admin:true,orders:state.orders.map(o=>JSON.parse(JSON.stringify(o)))};const p=person(id);if(!p)return null;const directOrders=state.orders.filter(o=>o.promoter===id).map(o=>({id:o.id,product:orderProduct(o).name,buyerAlias:maskBuyerName(o.buyerAlias),buyerMobile:maskPhone(o.buyerMobile),paid:o.paid,refund:o.refund,commission:o.commissionLegs.filter(l=>l.recipientId===id&&l.kind==='direct').reduce((a,l)=>a+l.amount,0),status:orderStatus(o)}));const indirect={pending:0,settled:0,count:0};for(const o of state.orders){for(const l of o.commissionLegs.filter(l=>l.recipientId===id&&l.kind==='parent')){indirect.count++;indirect[o.status==='settled'?'settled':'pending']+=l.amount}}return {id:p.id,name:p.name,level:p.level,parent:p.parentId?person(p.parentId).name:null,status:p.status,frozen:!!p.promotingFrozen,directOrders,children:p.level===1?state.people.filter(c=>c.level===2&&c.parentId===id).map(c=>({name:c.name,status:c.status})):[],indirect:p.level===1?indirect:null,wallet:JSON.parse(JSON.stringify(wallet(id))),pending:pending(id)}}
function setPreviewRole(id){if(id!=='admin'&&!person(id))return toast('无此演示角色');state.previewRole=id;commit()}
function relations(){const u=state.upgrade,d=person('P004'),net=upgradeSpend(u.entryParent),entry=person(u.entryParent),bindingChild=state.people.find(p=>p.id===state.bindingChildId&&p.level===2)||state.people.find(p=>p.level===2); state.bindingChildId=bindingChild?.id||null;return `<div class="section-top"><div><div class="eyebrow">运营后台 / 两级关系</div><h2>一级管直属二级，关系只到两层。</h2><p class="intro">A与E为一级，B初始绑定A，C为独立二级，D为普通消费者。可改绑或模拟消费升级；这些参数与结果均为评估样例。</p></div><button class="btn" data-go="roles">看角色隔离效果 →</button></div><div class="grid3"><div class="card"><span class="pill">B · 当前直属关系</span><h3 class="space-top">${person('P002').parentId?person(person('P002').parentId).name+' → B':'B · 独立无上级'}</h3><p class="sub">B直接成交100元：B预估5元、其支付时直属一级预估5元。</p></div><div class="card"><span class="pill">C · 独立二级</span><h3 class="space-top">C → 消费者</h3><p class="sub">C直接成交100元仅本人5元，无上级不虚构上级佣金，也不把另一份转给C。</p></div><div class="card"><span class="pill">一级直接推广</span><h3 class="space-top">A / E → 消费者</h3><p class="sub">本人直接成交100元示例仅得本人5元；不凭空生成下级佣金。最终政策待确认。</p></div></div><div class="card space-top"><h3>后台手动绑定</h3><p class="sub">二级只绑定一个已审核一级或保持独立；禁止自绑、绑定二级及第三级。改绑只影响之后新支付订单。</p><div class="form-grid"><label class="field">二级推广人<select id="bindingChild">${state.people.filter(p=>p.level===2).map(p=>`<option value="${p.id}" ${bindingChild?.id===p.id?'selected':''}>${esc(p.name)}（当前${p.parentId?'一级'+person(p.parentId).name:'独立'}）</option>`).join('')}</select></label><label class="field">直属一级<select id="bindingParent"><option value="" ${!bindingChild?.parentId?'selected':''}>独立，无上级</option>${state.people.filter(p=>p.level===1&&p.status==='已审核').map(p=>`<option value="${p.id}" ${bindingChild?.parentId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="field" style="justify-content:end"><button class="btn red" data-action="bindPromoter">保存演示绑定</button></div></div><div class="table-wrap space-top"><table><thead><tr><th>角色</th><th>级别</th><th>直属一级</th><th>资格状态</th></tr></thead><tbody>${state.people.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.level||'消费者'}</td><td>${p.parentId?person(p.parentId).name:'—'}</td><td>${p.status}${p.promotingFrozen?' · 新推广冻结':''}</td></tr>`).join('')}</tbody></table></div></div><div class="grid2 space-top"><div class="card"><span class="pill">消费者D · 模拟升级</span><h3 class="space-top">消费达门槛，成为对应一级下的二级</h3><p class="sub">只统计当前选定一级入口下的模拟已完成商品净实付，不混合不同一级、不计充值运费赠金。演示不额外收取费用，也不因升级或拉人发奖励；正式资格条件待核验。</p><div class="form-grid"><label class="field">指定一级入口<select id="upgradeEntry">${state.people.filter(p=>p.level===1&&p.status==='已审核').map(p=>`<option value="${p.id}" ${u.entryParent===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">模拟门槛（元）<input id="upgradeThreshold" type="number" step="0.01" min="0.01" value="${u.threshold/100}"></label><label class="check field wide"><input id="upgradeEnabled" type="checkbox" ${u.enabled?'checked':''}>启用自动成为二级演示（初始关闭）</label></div><button class="btn red space-top" data-action="saveUpgrade">保存模拟升级条件</button><div class="calc"><p>D在当前一级${entry.name}入口的有效净消费</p><strong>${money(net)}</strong><p>距模拟门槛尚差 ${money(Math.max(0,u.threshold-net))} · D当前${d.level===2?'已成为二级，绑定'+person(d.parentId).name:'为消费者'}</p></div><div class="info">后续改门槛或入口不悄悄改D已升级归属。退款低于升级时门槛，先冻结新推广资格并人工核实，旧单佣金快照不变。</div></div><div class="card"><h3>新增一笔已完成消费 / 原单退款</h3><div class="form-grid"><label class="field">演示原单号<input id="upgradeBusinessId" value="UP${String(u.purchases.length+1).padStart(3,'0')}"></label><label class="field">有效商品实付（元）<input id="upgradeAmount" type="number" step="0.01" min="0.01" value="1000"></label></div><div class="actions"><button class="btn dark" data-action="addUpgradeSpend">模拟增加已完成消费</button><button class="btn" data-action="repeatUpgradeSpend" ${u.purchases.length?'':'disabled'}>验证同原单不重复累计</button><button class="btn" data-action="reviewUpgrade">模拟资格人工复核</button></div><div class="info">这里只演示D的消费资格，增加消费不会生成推广订单或佣金。正式系统应核验真实履约、退款与服务端事件。</div>${u.purchases.length?`<div class="table-wrap space-top"><table><thead><tr><th>原单 / 入口</th><th>净额</th><th>退款演示</th></tr></thead><tbody>${[...u.purchases].reverse().map(x=>`<tr><td>${esc(x.businessId)} / ${person(x.parentId).name}</td><td>${money(x.amount-x.refund)}</td><td><button class="btn small" data-upgrade-refund="${esc(x.businessId)}" ${x.refund===x.amount?'disabled':''}>退${money(Math.min(2000,x.amount-x.refund))}</button> <button class="btn small" data-upgrade-repeat-refund="${esc(x.businessId)}" ${x.refundEvents.length?'':'disabled'}>重复退款通知</button></td></tr>`).join('')}</tbody></table></div>`:''}</div></div><div class="card space-top"><h3>升级与改绑留痕</h3>${[...u.records.map(r=>`${date(r.day)} · ${r.type} · 一级${person(r.parentId).name} · 净消费${money(r.amount)} / 当时门槛${money(r.threshold)}`),...state.bindings.map(r=>`${date(r.day)} · ${person(r.childId).name}由${r.before?person(r.before).name:'独立'}改至${r.after?person(r.after).name:'独立'}，旧单不变`)].map(t=>`<p class="sub">${esc(t)}</p>`).join('')||'<p class="sub">暂无演示记录。</p>'}</div>`}
function roles(){const p=projectRole(state.previewRole);return `<div class="section-top"><div><div class="eyebrow">角色端 / 角色可见内容预览</div><h2>不同角色，只展示对应内容。</h2><p class="intro">按身份展示本人可见内容；当前为角色切换演示，正式权限需后台校验。</p></div><label class="field">选择预览身份<select id="previewRole">${state.people.map(x=>`<option value="${x.id}" ${state.previewRole===x.id?'selected':''}>${x.name} · ${x.level===1?'一级':x.level===2?'二级':'消费者'}</option>`).join('')}<option value="admin" ${state.previewRole==='admin'?'selected':''}>运营后台 · 全部虚构订单</option></select></label></div>${p.admin?`<div class="info rose">运营后台全量演示；以下不是推广人可见页面。</div><div class="space-top">${p.orders.length?p.orders.map(orderCard).join(''):'<div class="empty">暂无订单。</div>'}</div>`:p.level===0?`<div class="card"><h3>D · 普通消费者</h3><p class="sub">尚未成为二级，没有推广链接或佣金。可在后台独立模拟消费达门槛，升级不会凭空发佣金。</p><button class="btn space-top" data-go="relations">查看升级场景</button></div>`:`<div class="grid4"><div class="metric red"><label>${esc(p.name)}本人可提现</label><strong>${money(p.wallet.available)}</strong><small>已结算且未冻结</small></div><div class="metric"><label>本人待结算</label><strong>${money(p.pending)}</strong><small>未签收途中不分钱</small></div><div class="metric"><label>本人推广资格</label><strong style="font-size:19px">${p.status}</strong><small>${p.frozen?'新推广冻结，旧单不变':p.level===1?'一级推广人':p.parent?'直属二级':'独立二级'}</small></div><div class="metric"><label>本人的直接推广订单</label><strong>${p.directOrders.length}</strong><small>只显示本人脱敏订单</small></div></div>${p.level===1?`<div class="grid2 space-top"><div class="card"><h3>${esc(p.name)}的直属二级名单</h3>${p.children.length?p.children.map(c=>`<div class="rowline"><b>${c.name}</b><span>${c.status}</span></div>`).join(''):'<p class="sub">暂无直属二级。</p>'}<p class="sub">仅显示名单和资格状态，不展示二级买家或客户交易。</p></div><div class="card"><h3>本人来自直属推广的佣金汇总</h3><div class="rowline"><span>脱敏来源</span><b>直属二级推广汇总</b></div><div class="rowline"><span>本人待结算</span><b>${money(p.indirect.pending)}</b></div><div class="rowline"><span>本人已结算净额</span><b>${money(p.indirect.settled)}</b></div><p class="sub">这里不给出下级订单号、商品明细、买家姓名电话或地址，也不展示成本。</p></div></div>`:''}<div class="card space-top"><h3>${esc(p.name)}本人的直接推广订单</h3>${p.directOrders.length?`<div class="table-wrap space-top"><table><thead><tr><th>本人订单</th><th>商品 / 脱敏客户</th><th>有效实付</th><th>本人佣金</th><th>状态</th></tr></thead><tbody>${p.directOrders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.product)}<br><small>${esc(o.buyerAlias)} · ${esc(o.buyerMobile)}</small></td><td>${money(o.paid-o.refund)}</td><td>${money(o.commission)}</td><td>${o.status}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty space-top">没有本人直接推广订单；来自直属二级的订单不在这里展开。</div>'}</div>`}<div class="info">当前仅预览该身份可见内容。其他运营配置页是管理员场景；正式系统须在后台校验身份与可见范围。</div>`}

function logisticsCard(o){const l=o.logistics,done=o.status==='settled'||o.status==='void',isException=EXCEPTIONS.includes(l.status);return `<div class="card"><div class="section-top"><div><span class="mini-label">${o.id} · 固定一单一包裹 · 演示数据</span><h3>${esc(orderProduct(o).name)}</h3><p class="sub">模拟收件人：客户＊ · 手机与地址不采集、不公开</p></div><span class="status ${l.confirmedDay!==null?'green':''}">${fulfillmentLabel(o)}</span></div><div class="grid2"><div><div class="form-grid"><label class="field">快递公司<select id="carrier-${o.id}" ${l.status!=='unshipped'?'disabled':''}><option ${l.carrier==='快递服务商A'?'selected':''}>快递服务商A</option><option ${l.carrier==='快递服务商B'?'selected':''}>快递服务商B</option></select></label><label class="field">虚构演示单号<input id="tracking-${o.id}" value="${esc(l.tracking||'DEMO-'+o.id)}" placeholder="DEMO-开头" ${l.status!=='unshipped'?'disabled':''}></label></div><div class="actions"><button class="btn dark" data-ship="${o.id}" ${done?'disabled':''}>${l.status==='unshipped'?'模拟发货':'验证重复发货'}</button><button class="btn" data-order="${o.id}" data-log-event="in_transit" ${done||l.status!=='shipped'?'disabled':''}>模拟运输中</button><button class="btn" data-order="${o.id}" data-log-event="out_for_delivery" ${done||l.status!=='in_transit'?'disabled':''}>模拟派送中</button><button class="btn" data-order="${o.id}" data-log-event="signed" ${done||!['out_for_delivery','signed'].includes(l.status)?'disabled':''}>${l.status==='signed'?'验证重复签收通知':'模拟物流签收'}</button><button class="btn red" data-confirm-receipt="${o.id}" ${done||l.status!=='signed'?'disabled':''}>${l.confirmedDay!==null?'验证重复确认收货':'模拟客户确认收货'}</button></div><div class="rowline"><span>物流原始签收</span><b>${l.rawSignedDay===null?'尚未签收':date(l.rawSignedDay)}</b></div><div class="rowline"><span>当前有效签收 / 客户确认</span><b>${l.signedDay===null?'—':date(l.signedDay)} / ${l.confirmedDay===null?'—':date(l.confirmedDay)}</b></div><div class="rowline"><span>本单预估佣金 / 可提现</span><b>${money(o.commission)} / ${o.status==='settled'?'已结算至独立佣金账户':'¥0.00'}</b></div><div class="info">物流签收仍不立即分钱。客户确认收货后再观察${o.afterDays}天，且无未结售后，才允许结算。自动确认收货规则待定。</div></div><div><h3>运单轨迹</h3>${l.tracks.length?`<div class="timeline">${l.tracks.map(t=>`<div class="timeline-item"><b>${esc(t.text)}</b><small>${date(t.day)} · ${esc(t.source)} · ${esc(t.id)} · 批次${t.generation}</small></div>`).join('')}</div>`:'<div class="empty space-top">待发货，暂无轨迹；未接入真实快递服务</div>'}</div></div><div class="space-top"><h3>物流异常与人工复核</h3><p class="sub">拒收、退回、配送异常只改变履约状态，不自动退款或回库。异常期间禁止普通回调直接恢复。已结算后若有退款，走原单佣金冲回，不重新分佣。</p><div class="actions">${['refused','returning','exception'].map(t=>`<button class="btn" data-order="${o.id}" data-log-event="${t}" ${l.status==='unshipped'||isException||o.status==='void'?'disabled':''}>模拟${LOG_STATUS[t]}</button>`).join('')}<button class="btn soft" data-recover-logistics="${o.id}" ${!isException?'disabled':''}>人工核实恢复运输</button></div>${l.exception?`<div class="info rose">${esc(l.exception)}。本单暂停完成与结佣，须人工核实。</div>`:''}</div></div>`}
function logistics(){const express=state.orders.filter(o=>o.fulfillment==='express'),pickup=state.orders.filter(o=>o.fulfillment==='pickup');return `<div class="section-top"><div><div class="eyebrow">快递信息 / 履约门槛</div><h2>货没签收，中途不分钱。</h2><p class="intro">本样板默认快递配送：物流签收 + 客户确认收货 → 售后观察期结束 → 结佣进入可提现。发货、在途、派送只锁定预估佣金。</p></div><button class="btn" data-go="share">创建演示订单 →</button></div><div class="simulation-banner"><div><b>演示时钟 · ${date(state.day)}</b><br><small>一单一包裹；真实轨迹接入与费用待评估</small></div><button class="btn soft" data-action="day">推进1天</button></div><div class="lifecycle"><span>支付：锁定预估</span><span>发货：不分钱</span><span>在途：不分钱</span><span>物流签收</span><span>客户确认收货</span><span>售后观察</span><span>结算后才可提现</span></div><div class="info rose">所有快递公司及DEMO单号、轨迹均为虚构演示，无真实物流接口。驿站代签或异常签收须核实，不直接视客户收货；多包裹未来应全部完成才汇总收货。</div><div class="page-section"><h3>快递订单 / 运单信息</h3>${express.length?[...express].reverse().map(logisticsCard).join(''):'<div class="empty">先创建一笔快递演示订单，再逐步模拟发货、运输、签收与确认收货。</div>'}</div>${pickup.length?`<div class="card space-top"><h3>到店自提独立路径</h3>${pickup.map(o=>`<div class="rowline"><div><b>${o.id} · ${esc(orderProduct(o).name)}</b><p class="sub">演示提货码 ${esc(o.pickup.code)} · ${fulfillmentLabel(o)}</p></div><button class="btn" data-pickup="${o.id}" ${o.status!=='paid'?'disabled':''}>模拟提货码核销</button></div>`).join('')}<p class="sub">自提不使用快递签收，但必须通过提货码核销；同样经过售后观察期再结佣。</p></div>`:''}<div class="card space-top"><h3>给开发预留的物流接入位置</h3><p class="sub">按订单/包裹保存快递公司、单号、查询或订阅渠道、原始轨迹和签收时间、事件唯一ID、接收时间、处理状态与人工复核记录；验签、防重复、乱序校验、失败重试和漏事件补查。异常恢复更新订阅批次，旧回调不覆盖；客户确认收货记录单独保存。</p><div class="actions"><button class="btn red" data-go="settlement">去看佣金与提现</button><button class="btn" data-go="developer">看开发评估</button></div></div>`}

function developer(){return `<div class="section-top"><div><div class="eyebrow">需求讨论 / 费用评估</div><h2>先把边界讲清楚，再决定开发</h2><p class="intro">本模块已纳入商城最终需求评审；新增范围、费用与工期由双方重新确认，所有示例参数待审批。请开发评估复用部分、新增部分和第三方条件。</p></div><button class="btn red" data-action="download">下载需求文字</button></div><div class="grid2"><div class="card"><h3>本轮两级重梳理范围</h3><ul class="list"><li>两级直属关系，订单同时冻结直接推广人与合法直属一级。</li><li>按单商品、系列、标签配置直接推广/直属一级两项比例，避免逐个重复设置。</li><li>快递签收并确认收货或自提核销、扣除退款、过售后期后结佣。</li><li>佣金明细和提现申请可查，购物钱包继续独立。</li></ul></div><div class="card"><h3>待你决定的业务参数</h3><ul class="list"><li>谁能参与、哪些门店/商品可推广、比例与成本预算。</li><li>归因窗口、最后链接规则、新老客和自购范围。</li><li>售后观察期、结算周期、最低提现及付款方式。</li><li>跨店归属、退款追偿、收款身份与相关费用处理。</li></ul></div></div><div class="card space-top"><h3>开发工作包</h3><div class="table-wrap space-top"><table><thead><tr><th>模块</th><th>交付范围</th><th>验收重点</th></tr></thead><tbody><tr><td>推广人 / 分享</td><td>审核、启停、商品/系列/标签分享标识、访问归因</td><td>未审核不能推广；链接篡改校验；推广人仅看自己的数据</td></tr><tr><td>快递履约 / 自提</td><td>运单、轨迹订阅、签收与客户确认、异常人工复核；自提码核销独立</td><td>中途不结佣；未签收不确认；重复或乱序不跳步；异常暂停；确认后观察期</td></tr><tr><td>比例规则</td><td>范围、优先级、生效时间、排除、版本与发布权限</td><td>不叠比例；0%生效；冲突拦截；旧单不随改价改佣</td></tr><tr><td>订单佣金</td><td>逐商品行快照、履约与售后事件、结算、退款重算</td><td>支付/履约/退款重复通知不重复记账；未结束售后不结佣</td></tr><tr><td>提现 / 对账</td><td>申请冻结、审核、付款结果、驳回/失败释放、追溯</td><td>余额不足拒绝；超时先查结果；同一业务仅处理一次</td></tr><tr><td>运营报表</td><td>门店、商品、推广人、活动维度</td><td>有效实付、退款、净佣金、待结算、已付款分别统计</td></tr></tbody></table></div></div><div class="grid2 space-top"><div class="card"><h3>建议开发现场演示的用例</h3><ul class="list"><li>B成交100元，B与直属一级A各5元；退款20元后各4元。</li><li>未完成不结算；观察期内不结算；重复结算无新增。</li><li>B支付后改绑E，旧单仍归原一级A；新单按新绑定。</li><li>提现后退款导致不足，形成待抵扣并暂停新提现。</li><li>驳回或失败仅释放一次，不因重复通知增加余额。</li></ul></div><div class="card"><h3>接入与资金条件另评</h3><p class="sub">提现先展示申请、审核和付款结果；真实自动打款另核商户资格、商家转账权限、场景审核及接口。真实微信分享卡片、小程序码、跨入口归因与收款身份，应由开发结合当前账号能力核实。真实物流查询、订阅回调的账号与费用另评；驿站代签或异常签收须核实，不直接视客户收货。跳到第三方交易域的订单不能默认算作本商城订单。</p><p class="sub space-top">微信支付官方说明：<a href="https://pay.wechatpay.cn/doc/v3/merchant/4013740645" target="_blank" rel="noopener">商家转账</a> · <a href="https://pay.wechatpay.cn/doc/v3/merchant/4012711988" target="_blank" rel="noopener">接入能力核验</a>。具体以商户当前可用能力为准。物流参考：<a href="https://api.kuaidi100.com/document/5f0ffa8f2977d50a94e1023c" target="_blank" rel="noopener">快递100官方订阅推送文档</a>，当前样板未接入真实账号。</p><p class="sub space-top">推广仅围绕直接商品成交；真实系统须服务端鉴权、按角色投影字段并拦截越权请求。消费资格与上下级收益政策应单列业务、法务及平台审核，本页不宣称已合规或平台准许。参与协议、公开规则及资金处理在正式立项时确认。本样板不收集真实姓名、手机号或收款账户。</p><div class="actions"><button class="btn" data-action="copyReq">复制开发需求</button><button class="btn" data-action="download">下载文字清单</button></div></div></div>`}
function render(){document.body.classList.toggle('is-mobile-demo',tab==='mobile');document.body.classList.toggle('mobile-only',tab==='mobile'&&(embedMode||mobileMode));document.body.classList.toggle('embed-mode',embedMode);const content={overview,mobile,products, promoter,share,rules,relations,roles,logistics,settlement,developer};$('nav').innerHTML=TABS.map((x,i)=>`<button class="${tab===x[0]?'active':''}" data-go="${x[0]}" aria-current="${tab===x[0]?'page':'false'}"><span>${String(i+1).padStart(2,'0')}</span>${x[1]}</button>`).join('');$('main').innerHTML=content[tab]()+`${embedMode?'':`<div class="footer"><span>便民欢 · 分销推广最终需求评审 · 2026.11.02</span><span>本机演示保存 <button class="text-link" data-action="reset">重置样板</button></span></div>`}`;bind()}
function collectRules(){return state.rules.map(r=>{const row=document.querySelector(`[data-rule-id="${r.id}"]`);return row?{...r,enabled:row.querySelector('.ruleEnabled').checked,bp:parseDecimal(row.querySelector('.rulePercent').value,100),parentBp:parseDecimal(row.querySelector('.ruleParentPercent').value,100),priority:parseInteger(row.querySelector('.rulePriority').value,1,999)}:r})}
function saveRules(){refreshBusinessState();const rs=collectRules(),e=validateRules(rs);if(e)return toast(e);const cfg={windowDays:parseInteger($('windowDays').value,1,30),afterDays:parseInteger($('afterDays').value,0,90),minWithdraw:parseDecimal($('minWithdraw').value,100000),selfAllowed:$('selfAllowed').checked};if(!Number.isInteger(cfg.windowDays)||cfg.windowDays<1||cfg.windowDays>30||!Number.isInteger(cfg.afterDays)||cfg.afterDays<0||cfg.afterDays>90||!Number.isInteger(cfg.minWithdraw)||cfg.minWithdraw<1||cfg.minWithdraw>10000000)return toast('请核对窗口1–30天、观察0–90天和提现0.01–100000元');state.rules=rs;state.config=cfg;state.excluded=[...document.querySelectorAll('.excludeProduct:checked')].map(x=>x.value);log('本机保存推广比例和参数，仅影响新订单');commit('规则已保存到本机演示，旧订单快照保留')}
function addRule(){refreshBusinessState();const scope=$('newScope').value,target=$('newTarget').value,bp=parseDecimal($('newPercent').value,100),parentBp=parseDecimal($('newParentPercent').value,100),priority=parseInteger($('newPriority').value,1,999);const rs=[...collectRules(),{id:'R'+Date.now(),scope,target,bp,parentBp,priority,enabled:true}];const err=validateRules(rs);if(err)return toast(err);state.rules=rs;commit('规则已添加并通过当前商品范围冲突校验')}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制，可粘贴给开发讨论')}catch(e){toast('当前环境无法复制，请使用下载文字清单')}}
function download(){const a=document.createElement('a');a.href='requirements.txt';a.download='便民欢分销推广开发评估说明.txt';a.click()}
function bind(){$('mobilePromoter')?.addEventListener('change',e=>{state.promoter=e.target.value;commit()});$('mobileFulfillment')?.addEventListener('change',e=>{state.fulfillment=e.target.value;commit()});document.querySelectorAll('[data-mobile-view]').forEach(el=>el.onclick=()=>setMobileView(el.dataset.mobileView));document.querySelectorAll('[data-mobile-share]').forEach(el=>el.onclick=()=>mobileShare(el.dataset.mobileShare));document.querySelectorAll('[data-mobile-buy]').forEach(el=>el.onclick=()=>mobileBuyProduct(el.dataset.mobileBuy));document.querySelectorAll('[data-mobile-order]').forEach(el=>el.onclick=()=>mobileOrderAction(el.dataset.mobileOrder,el.dataset.mobileStep));document.querySelectorAll('[data-mobile-settle]').forEach(el=>el.onclick=()=>mobileSettle(el.dataset.mobileSettle));document.querySelectorAll('[data-edit-product]').forEach(el=>el.onclick=()=>{state.editingProduct=el.dataset.editProduct;state.productDraft=null;commit()});document.querySelectorAll('[data-product-state]').forEach(el=>el.onclick=()=>setProductState(el.dataset.productState,{[el.dataset.stateField]:el.dataset.stateValue==='true'}));$('bindingChild')?.addEventListener('change',e=>{state.bindingChildId=e.target.value;$('bindingParent').value=person(e.target.value).parentId||'';save()});$('previewRole')?.addEventListener('change',e=>setPreviewRole(e.target.value));document.querySelectorAll('[data-upgrade-refund]').forEach(el=>el.onclick=()=>{const x=state.upgrade.purchases.find(x=>x.businessId===el.dataset.upgradeRefund);refundUpgradeSpend(x.businessId,Math.min(2000,x.amount-x.refund),'UPRF-'+(x.refundEvents.length+1))});document.querySelectorAll('[data-upgrade-repeat-refund]').forEach(el=>el.onclick=()=>{const x=state.upgrade.purchases.find(x=>x.businessId===el.dataset.upgradeRepeatRefund);refundUpgradeSpend(x.businessId,2000,x.refundEvents[x.refundEvents.length-1])});document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>goto(el.dataset.go));$('promoterSelect')?.addEvent
