<header><div class="brand"><img src="bianminhuan-logo.png" alt="便民欢 BIANMINHUAN"><div><strong>分销推广 · 独立场景样板</strong><p>让好商品，被愿意分享的人带出去</p></div></div><span class="status-pill">待讨论</span></header>
<div class="notice"><b>独立评估</b> · 未纳入商城总方案或既有报价 · 比例、周期、门槛均为示例待确认 · 本机演示，无真实交易</div>
<div class="shell"><aside><div class="sidecap">SCENARIO / 01</div><nav id="nav"></nav><div class="side-note"><b>先看懂，再决定做不做。</b>只展示推广人直接带来的订单。佣金账户与购物钱包分开。<br><br>2026.11.02 · 独立讨论版</div></aside><main id="main"></main></div><div id="toast" class="toast" hidden role="status"></div>
<script>
'use strict';
const KEY='bianminhuan_referral_demo_v1';
const PRODUCTS=[{id:'basket',name:'家庭鲜蔬菜篮',spec:'固定组合 · 1份',price:10000,series:'family',tags:['opening','daily'],color:'#59904a'},{id:'eggs',name:'鲜鸡蛋家庭装',spec:'10枚 / 盒',price:2000,series:'egg',tags:['opening'],color:'#d6a65e'},{id:'lettuce',name:'当日鲜叶菜',spec:'500g / 份',price:800,series:'family',tags:['daily'],color:'#7da246'}];
const SERIES={family:'家庭菜篮系列',egg:'安心蛋品系列'},TAGS={opening:'开业精选',daily:'日常好物'};
const PEOPLE=[{id:'P001',name:'推广人A',status:'已审核'},{id:'P002',name:'推广人B',status:'已审核'},{id:'P003',name:'推广人C',status:'待审核'}];
const TABS=[['overview','样板概览'],['promoter','推广人中心'],['share','分享成交演示'],['rules','佣金规则后台'],['settlement','订单结算提现'],['developer','开发评估']];
const INIT=()=>({version:1,day:0,promoter:'P001',product:'basket',shareScope:'sku',lastLink:null,visit:null,orders:[],withdrawals:[],wallets:{P001:{available:0,debt:0,paid:0},P002:{available:0,debt:0,paid:0}},rules:[{id:'R1',scope:'sku',target:'basket',bp:1000,priority:1,enabled:true},{id:'R2',scope:'series',target:'family',bp:600,priority:10,enabled:true},{id:'R3',scope:'tag',target:'opening',bp:800,priority:10,enabled:true},{id:'R4',scope:'default',target:'all',bp:200,priority:100,enabled:true}],excluded:[],config:{windowDays:7,afterDays:7,minWithdraw:500,selfAllowed:false},logs:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null');if(!state||state.version!==1)state=INIT()}catch(e){state=INIT()}
let tab=TABS.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'overview';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'¥'+(n/100).toFixed(2),percent=bp=>(bp/100).toFixed(bp%100?2:0)+'%',product=id=>PRODUCTS.find(x=>x.id===id),person=id=>PEOPLE.find(x=>x.id===id),wallet=id=>state.wallets[id]||{available:0,debt:0,paid:0};
const date=d=>{const dt=new Date(Date.UTC(2026,10,2+d));return `${dt.getUTCMonth()+1}月${dt.getUTCDate()}日`};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('本机存储不可用，本次操作仅保留到刷新前')}};
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function log(t){state.logs.unshift({day:state.day,text:t});state.logs=state.logs.slice(0,40)}
function goto(id){tab=id;location.hash=id;render();window.scrollTo({top:0,behavior:'smooth'})}
window.addEventListener('hashchange',()=>{const n=location.hash.slice(1);if(TABS.some(x=>x[0]===n)&&tab!==n){tab=n;render()}});
function commit(msg){save();render();if(msg)toast(msg)}
function art(p){return `<div class="art" aria-hidden="true"><svg viewBox="0 0 180 140"><ellipse cx="90" cy="120" rx="65" ry="8" fill="#dfd0ad"/>${p.id==='eggs'?'<path d="M30 85h120l-9 29H39z" fill="#b69c70"/><g fill="#fff6df" stroke="#e7d8b7" stroke-width="2"><ellipse cx="59" cy="67" rx="18" ry="25"/><ellipse cx="97" cy="64" rx="18" ry="27"/><ellipse cx="129" cy="75" rx="16" ry="22"/></g>':'<path d="M35 76h110l-12 42H47z" fill="#c69959"/><path d="M34 76h112v10H34z" fill="#e2ba76"/><g fill="'+p.color+'"><ellipse cx="56" cy="61" rx="21" ry="31" transform="rotate(-25 56 61)"/><ellipse cx="98" cy="54" rx="23" ry="34" transform="rotate(10 98 54)"/><ellipse cx="123" cy="67" rx="20" ry="24"/></g><path d="M56 36l12 45M98 26l-3 56M130 48l-8 34" stroke="#aec58a" stroke-width="3"/><circle cx="82" cy="81" r="20" fill="#df6141"/><path d="M79 63l5 7 8-4-4 9" fill="#45754c"/>'}<path d="M54 91h74M58 101h66M70 86l5 27M97 86l-1 27M120 86l-6 27" stroke="#aa7b3e" stroke-width="2" opacity=".5"/></svg></div>`}
function scopeName(r){return r.scope==='sku'?product(r.target)?.name:r.scope==='series'?SERIES[r.target]:r.scope==='tag'?TAGS[r.target]:'未命中时默认'}
function matches(r,p){return r.enabled&&(r.scope==='default'||r.scope==='sku'&&r.target===p.id||r.scope==='series'&&r.target===p.series||r.scope==='tag'&&p.tags.includes(r.target))}
function resolveRule(pid,rules=state.rules,excluded=state.excluded){const p=product(pid);if(excluded.includes(pid))return {bp:0,name:'单品排除',excluded:true};const rank={sku:0,series:1,tag:2,default:3};const rs=rules.filter(r=>matches(r,p)).sort((a,b)=>rank[a.scope]-rank[b.scope]||a.priority-b.priority);if(!rs.length)return {bp:0,name:'无适用规则',excluded:true};if(rs[1]&&rank[rs[0].scope]===rank[rs[1].scope]&&rs[0].priority===rs[1].priority)return {bp:0,name:'规则冲突，禁止计佣',conflict:true};return {...rs[0],name:scopeName(rs[0])}}
function parseDecimal(raw,max){const text=String(raw).trim();if(!/^\d+(?:\.\d{1,2})?$/.test(text))return NaN;const n=Number(text);return Number.isFinite(n)&&n>=0&&n<=max?Math.round(n*100):NaN}
function parseInteger(raw,min,max){const text=String(raw).trim();if(!/^\d+$/.test(text))return NaN;const n=Number(text);return Number.isSafeInteger(n)&&n>=min&&n<=max?n:NaN}
function validateRules(rules){for(const r of rules){if(!Number.isInteger(r.bp)||r.bp<0||r.bp>10000)return '比例须必填，0%至100%之间且最多两位小数';if(!Number.isInteger(r.priority)||r.priority<1||r.priority>999)return '优先级须为1至999的整数'}for(const p of PRODUCTS){const groups={};for(const r of rules.filter(r=>matches(r,p))){const key=r.scope+':'+r.priority;if(groups[key])return `${p.name}命中同层同优先级规则，请调整优先级或停用重叠规则`;groups[key]=r.id}}return ''}
function due(o){return o.status==='completed'&&state.day>=o.maturityDay}
function pending(pid){return state.orders.filter(o=>o.promoter===pid&&o.status!=='settled'&&o.status!=='void').reduce((a,o)=>a+o.commission,0)}
function frozen(pid){return state.withdrawals.filter(w=>w.promoter===pid&&['applied','approved'].includes(w.status)).reduce((a,w)=>a+w.amount,0)}
function earning(pid){return state.orders.filter(o=>o.promoter===pid).reduce((a,o)=>a+o.commission,0)}
function deposit(pid,amount){const w=wallet(pid),offset=Math.min(w.debt,amount);w.debt-=offset;w.available+=amount-offset}
function commission(paid,refund,bp){return Math.floor((paid-refund)*bp/10000)}
function makeLink(){const p=person(state.promoter);if(p.status!=='已审核')return toast('该推广人待审核，暂不能生成推广链接');const selected=product(state.product);state.lastLink={promoter:p.id,scope:state.shareScope,target:state.shareScope==='sku'?selected.id:state.shareScope==='series'?selected.series:selected.tags[0],createdDay:state.day};log(`${p.name}生成${state.shareScope==='sku'?'商品':state.shareScope==='series'?'系列':'标签'}推广链接`);commit('已生成演示推广链接')}
function openLink(){if(!state.lastLink)return toast('请先生成推广链接');state.visit={...state.lastLink,openedDay:state.day};log(`演示客户打开${person(state.visit.promoter).name}的链接，归因窗口至${date(state.day+state.config.windowDays)}`);commit('客户已进入商城，尚未锁定成交归属')}
function pay(){const p=product(state.product),r=resolveRule(p.id);if(r.conflict)return toast('规则冲突，请先在后台修正');const self=$('selfPurchase')?.checked||false;let promoter=null,reason='自然访问，无推广归属';if(state.visit){const v=state.visit;const inScope=v.scope==='sku'?p.id===v.target:v.scope==='series'?p.series===v.target:p.tags.includes(v.target);if(state.day-v.openedDay>=state.config.windowDays)reason='推广访问已过有效期';else if(!inScope)reason='商品不在当前推广链接范围';else if(self&&!state.config.selfAllowed)reason='推广人自购，本例不计佣';else if(r.excluded)reason=r.name;else{promoter=v.promoter;reason='有效期内最后有效链接归属，支付时锁定'}}const id='DM'+String(state.orders.length+1).padStart(4,'0');const o={id,product:p.id,paid:p.price,refund:0,promoter,bp:promoter?r.bp:0,ruleName:r.name,ruleId:r.id||null,commission:promoter?commission(p.price,0,r.bp):0,status:'paid',createdDay:state.day,afterDays:state.config.afterDays,reason};state.orders.push(o);log(`${id}模拟支付${money(o.paid)}，${promoter?person(promoter).name:'无推广人'}，预估佣金${money(o.commission)}`);commit('模拟支付成功，归属和佣金比例已锁定')}
function complete(id){const o=state.orders.find(o=>o.id===id);if(o.status!=='paid')return toast('该订单已处理，不重复确认');o.status='completed';o.completedDay=state.day;o.maturityDay=state.day+o.afterDays;log(`${id}完成履约，${o.afterDays}天售后观察期开始`);commit('订单完成，佣金进入售后观察期')}
function settle(id){const o=state.orders.find(o=>o.id===id);if(o.aftersaleOpen)return toast('该订单售后仍在处理中，暂缓结算');if(!due(o))return toast(o.status==='settled'?'该订单已结算，不会重复入账':'尚未满足结算条件');if(o.promoter)deposit(o.promoter,o.commission);o.status='settled';o.settledDay=state.day;log(`${id}结算佣金${money(o.commission)}至推广账户`);commit('佣金已结算；如有待抵扣，先抵扣后释放')}
function refund(id,amount,refundId){const o=state.orders.find(o=>o.id===id);o.refundEvents=o.refundEvents||[];const eventId=refundId||('RF'+String(o.refundEvents.length+1));if(o.refundEvents.some(x=>x.id===eventId))return toast('同一退款业务已处理，重复通知不重复扣佣');if(!Number.isInteger(amount)||amount<=0||amount>o.paid-o.refund)return toast('退款金额须大于0，且不能超过未退金额');o.refundEvents.push({id:eventId,amount});const old=o.commission;o.refund+=amount;o.commission=commission(o.paid,o.refund,o.bp);const claw=old-o.commission;if(o.status==='settled'&&o.promoter){const w=wallet(o.promoter),cut=Math.min(w.available,claw);w.available-=cut;w.debt+=claw-cut}if(o.refund===o.paid&&o.status!=='settled')o.status='void';log(`${id}退款${money(amount)}，佣金调减${money(claw)}${o.status==='settled'?'，已结算部分冲回':''}`);commit('退款已按原单比例重算累计佣金，不重复发放')}
function withdraw(){const pid=state.promoter,w=wallet(pid);if(person(pid).status!=='已审核')return toast('推广人尚未审核');const amount=parseDecimal($('withdrawAmount')?.value,100000);if(!Number.isInteger(amount)||amount<state.config.minWithdraw)return toast(`本例单次至少${money(state.config.minWithdraw)}`);if(w.debt>0)return toast('存在待抵扣佣金，暂不能申请提现');if(amount>w.available)return toast('可提现余额不足');w.available-=amount;const id='WD'+String(state.withdrawals.length+1).padStart(3,'0');state.withdrawals.unshift({id,promoter:pid,amount,status:'applied',day:state.day});log(`${id}提交模拟提现申请${money(amount)}，金额已冻结`);commit('提现申请已生成，金额冻结等待审核')}
function updateWithdraw(id,next){const w=state.withdrawals.find(x=>x.id===id);const valid={applied:['approved','rejected'],approved:['paid','failed']};if(!(valid[w.status]||[]).includes(next))return toast('该申请当前状态不支持此操作，不重复处理');if(['approved','paid'].includes(next)&&wallet(w.promoter).debt>0)return toast('该推广人存在待抵扣，须先处理异常再审核或打款');w.status=next;if(['rejected','failed'].includes(next))deposit(w.promoter,w.amount);if(next==='paid')wallet(w.promoter).paid+=w.amount;log(`${id}${{approved:'审核通过，等待付款',rejected:'驳回并释放冻结',paid:'模拟已打款',failed:'模拟付款失败并释放冻结'}[next]}`);commit(next==='paid'?'仅模拟已打款，无真实资金操作':'状态已更新，同一申请不重复返还金额')}
function stats(){const pid=state.promoter,w=wallet(pid);return `<div class="grid4"><div class="metric red"><label>可提现佣金</label><strong>${money(w.available)}</strong><small>已结算且未冻结的金额</small></div><div class="metric"><label>待结算</label><strong>${money(pending(pid))}</strong><small>待履约 / 售后观察 / 待结算</small></div><div class="metric"><label>提现冻结中</label><strong>${money(frozen(pid))}</strong><small>申请中 / 审核通过待付款</small></div><div class="metric"><label>${w.debt?'待抵扣佣金':'累计模拟打款'}</label><strong>${money(w.debt||w.paid)}</strong><small>${w.debt?'退款后不足冲回，暂停提现':'全为演示，不代表实际到账'}</small></div></div>`}
function phone(){const w=wallet(state.promoter);return `<div class="phone"><div class="phone-top"><span>9:41</span><span>●●● ▰</span></div><div class="phone-head"><small>便民欢 · 推广中心</small><h3>分享好物，成交有奖励</h3><p>${person(state.promoter).name} · ${person(state.promoter).status}</p></div><div class="phone-body"><div class="wallet"><p>可提现佣金（示例）</p><div class="big">${money(w.available)}</div><p>与商城购物余额分别记账</p></div><div class="phone-grid"><div><b>${money(pending(state.promoter))}</b><small>待结算佣金</small></div><div><b>${state.orders.filter(o=>o.promoter===state.promoter).length}</b><small>直接推广订单</small></div></div><button class="btn red" data-go="promoter">选商品 · 生成推广链接</button><button class="btn" data-go="settlement">佣金明细 / 提现申请</button><div class="phone-row"><span>商品、系列、标签</span><b>均可配置比例</b></div><div class="phone-row"><span>完成订单 → 售后期结束</span><b>再结算</b></div></div><div class="phone-bottom">场景样板 · 非真实小程序</div></div>`}
function selectPerson(){return `<label class="field">当前推广人<select id="promoterSelect">${PEOPLE.map(p=>`<option value="${p.id}" ${state.promoter===p.id?'selected':''}>${p.name} · ${p.status}</option>`).join('')}</select></label>`}
function overview(){return `<div class="hero"><div class="hero-story"><div class="eyebrow">独立讨论 / 推广分佣</div><h1>别人帮我们卖，<br>成交后给他结佣。</h1><p class="intro">为指定推广人生成带归属标识的商品、系列或标签链接。客户进商城下单，订单完成并过售后期后，佣金转入推广人的可提现账户。</p><div class="hero-stat"><div><strong>3种</strong><small>商品 / 系列 / 标签</small></div><div><strong>1级</strong><small>直接成交推广</small></div><div><strong>独立账</strong><small>佣金与购物余额分开</small></div></div><div class="actions"><button class="btn red" data-go="share">体验一次分享成交 →</button><button class="btn" data-go="rules">看后台怎么配置</button></div><div class="step-flow">${[['01','审核推广人','谁可以参与推广'],['02','分享专属链接','标识推广人和范围'],['03','客户下单','支付时锁定归属'],['04','售后结束结佣','退款后按净额计算'],['05','申请提现','冻结、审核、付款']].map(x=>`<div class="flow-step"><span>${x[0]}</span><b>${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div><div class="info">所有比例和期限均为方便评估的示例。当前页面只保存本机演示状态，不与已上线商城、收银或微信支付连接。</div></div>${phone()}</div><div class="page-section grid3"><div class="card"><div class="mini-label">对推广人</div><h3>知道分享什么、能赚多少</h3><p class="sub">展示可推广商品、当前比例和预估奖励，区分待结算、可提现与冻结金额。</p></div><div class="card"><div class="mini-label">对运营</div><h3>一个商品，或一组商品</h3><p class="sub">单品单独定佣，也可按系列、标签批量设置，保留暂停推广和商品排除。</p></div><div class="card"><div class="mini-label">对开发</div><h3>订单、佣金、提现可追溯</h3><p class="sub">归因记录、规则快照、退款重算与提现流水分开，避免重复结佣和重复返还。</p></div></div>`}
function promoter(){return `<div class="section-top"><div><div class="eyebrow">推广人端</div><h2>我的推广中心</h2><p class="intro">已审核推广人查看自己的商品和佣金；本样板切换角色仅为演示。</p></div>${selectPerson()}</div>${stats()}<div class="page-section"><h3>选择一款，分享给需要的人</h3><div class="grid3">${PRODUCTS.map(p=>{const r=resolveRule(p.id);return `<div class="card product-card">${art(p)}<h3 class="product-title">${p.name}</h3><p class="sub">${p.spec}</p><div class="product-line"><span class="price">${money(p.price)}</span><span class="reward">${r.excluded?'暂不计佣':`比例 ${percent(r.bp)}`}</span></div><p class="sub">预估奖励 <b class="strong-red">${money(commission(p.price,0,r.bp))}</b> / 份</p><button class="btn red space-top" data-share-product="${p.id}" ${person(state.promoter).status!=='已审核'?'disabled':''}>生成推广链接</button></div>`}).join('')}</div></div><div class="info">预估奖励按当前商品实付示例计算，实际以支付时规则快照及退款后的有效商品实付为准。分享点击本身不产生佣金。</div>`}
function share(){const p=product(state.product),r=resolveRule(p.id),l=state.lastLink,v=state.visit;const path=l?`/pages/${l.scope==='sku'?'product/detail':'campaign/list'}?${l.scope}=${l.target}&ref=${l.promoter}`:'';return `<div class="section-top"><div><div class="eyebrow">从链接到订单</div><h2>亲手走一次分享成交</h2><p class="intro">先生成链接，再打开客户视角，最后模拟下单。可以切换推广人，比较最后有效链接的归属。</p></div><button class="btn" data-go="settlement">查看结算与提现 →</button></div><div class="simulation-banner"><div><b>演示时钟 · ${date(state.day)}</b><br><small>每次推进只改变本机样板日期</small></div><button class="btn soft" data-action="day">推进1天</button></div><div class="grid2"><div class="card"><span class="pill">01 · 推广人生成链接</span><div class="form-grid">${selectPerson()}<label class="field">推广商品<select id="productSelect">${PRODUCTS.map(p=>`<option value="${p.id}" ${state.product===p.id?'selected':''}>${p.name}</option>`).join('')}</select></label><label class="field wide">分享范围<select id="scopeSelect"><option value="sku" ${state.shareScope==='sku'?'selected':''}>单个商品</option><option value="series" ${state.shareScope==='series'?'selected':''}>这个商品所属系列</option><option value="tag" ${state.shareScope==='tag'?'selected':''}>这个商品的首个标签</option></select></label></div><div class="actions"><button class="btn red" data-action="makeLink">生成演示推广链接</button></div>${l?`<div class="code space-top">${esc(path)}</div><p class="sub">${person(l.promoter).name} · ${l.scope==='sku'?product(l.target).name:l.scope==='series'?SERIES[l.target]:TAGS[l.target]} · 演示路径</p><div class="actions"><button class="btn" data-action="copyLink">复制路径说明</button><button class="btn dark" data-action="openLink">模拟客户打开链接</button></div>`:'<div class="empty space-top">生成后可看到带推广人标识的路径</div>'}<div class="info">真实小程序需由开发实现分享卡片 / 小程序码及服务端归因，本网页复制的是说明用演示路径。</div></div><div class="card"><span class="pill">02 · 客户在商城购买</span><div class="space-top">${art(p)}</div><h3 class="space-top">${p.name}</h3><p class="sub">${p.spec} · 商城统一收款，门店履约</p><div class="product-line"><span class="price">${money(p.price)}</span><span class="reward">当前比例 ${percent(r.bp)}</span></div><div class="rowline"><span>有效推广访问</span><b>${v?person(v.promoter).name:'尚未打开链接'}</b></div><div class="rowline"><span>本次访问期限</span><span>${v?date(v.openedDay)+' 至 '+date(v.openedDay+state.config.windowDays)+'前':'—'}</span></div><label class="check space-top"><input type="checkbox" id="selfPurchase">模拟推广人自购（默认不计佣）</label><button class="btn red space-top" data-action="pay">模拟支付 ${money(p.price)}</button><p class="sub">支付时冻结推广人、商品行实付、比例、规则版本；后改规则不影响旧单。</p></div></div><div class="page-section"><h3>最近一笔演示订单</h3>${state.orders.length?orderCard(state.orders[state.orders.length-1]):'<div class="empty">完成模拟支付后，这里显示归属和预估佣金。</div>'}</div>`}
function ruleRows(){return state.rules.map(r=>`<tr data-rule-id="${r.id}"><td><input type="checkbox" class="ruleEnabled" ${r.enabled?'checked':''} aria-label="启用${esc(scopeName(r))}"></td><td>${{sku:'单商品',series:'商品系列',tag:'商品标签',default:'默认'}[r.scope]}</td><td>${esc(scopeName(r))}</td><td><input class="rulePercent" aria-label="${esc(scopeName(r))}比例" type="number" min="0" max="100" step="0.01" value="${r.bp/100}" style="width:85px"> %</td><td><input class="rulePriority" aria-label="${esc(scopeName(r))}优先级" type="number" min="1" max="999" value="${r.priority}" style="width:72px"></td><td><button class="text-link" data-remove-rule="${r.id}">删除</button></td></tr>`).join('')}
function rules(){return `<div class="section-top"><div><div class="eyebrow">运营后台样板</div><h2>按商品、系列或标签设置比例</h2><p class="intro">保存到本机演示。真实系统应由运营权限控制，审核发布并保留改动记录。</p></div><button class="btn red" data-action="saveRules">保存本机规则</button></div><div class="card"><h3>规则命中顺序</h3><div class="rules-priority"><span>单商品排除</span><b>优先</b><span>单商品比例</span><b>›</b><span>系列比例</span><b>›</b><span>标签比例</span><b>›</b><span>默认比例</span></div><p class="sub">同层多条规则按优先级数字从小到大选择；同优先级重叠时拦截保存。比例不叠加，0%也是有效规则。</p><div class="table-wrap space-top"><table><thead><tr><th>启用</th><th>范围</th><th>匹配对象</th><th>佣金比例</th><th>优先级</th><th>操作</th></tr></thead><tbody>${ruleRows()}</tbody></table></div><div class="form-grid"><label class="field">新增规则范围<select id="newScope"><option value="sku">单商品</option><option value="series">商品系列</option><option value="tag">商品标签</option><option value="default">默认</option></select></label><label class="field">规则对象<select id="newTarget">${PRODUCTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label class="field">比例（%）<input id="newPercent" type="number" min="0" max="100" step="0.01" value="5"></label><label class="field">优先级（数字小优先）<input id="newPriority" type="number" min="1" max="999" value="20"></label><div class="field" style="justify-content:end"><button class="btn" data-action="addRule">加入规则并校验</button></div></div><div class="info">保存后只影响新订单。已支付订单继续使用原规则快照。新增系列或标签时，应重新检查其商品范围与规则重叠。</div></div><div class="grid2 space-top"><div class="card"><h3>结算与归因参数</h3><div class="form-grid"><label class="field">链接归因窗口（天）<input id="windowDays" type="number" min="1" max="30" value="${state.config.windowDays}"></label><label class="field">完成后售后观察（天）<input id="afterDays" type="number" min="0" max="90" value="${state.config.afterDays}"></label><label class="field">最低提现（元）<input id="minWithdraw" type="number" min="0.01" max="100000" step="0.01" value="${state.config.minWithdraw/100}"></label><label class="check field wide"><input id="selfAllowed" type="checkbox" ${state.config.selfAllowed?'checked':''}>允许自购计佣（示例默认关闭）</label></div><p class="sub">本例创建订单即模拟支付，须在窗口内完成；有效期内最后有效链接在支付时锁定当前订单；不永久绑定客户，不因分享链接自动获得客户个人资料。新老客均可，待业务确认。</p></div><div class="card"><h3>单品排除与命中预览</h3>${PRODUCTS.map(p=>{const r=resolveRule(p.id);return `<div class="rowline"><label class="check"><input class="excludeProduct" type="checkbox" value="${p.id}" ${state.excluded.includes(p.id)?'checked':''}>排除 ${p.name}</label><span>${r.excluded?r.name:percent(r.bp)+' · '+esc(r.name)}</span></div>`}).join('')}<div class="actions"><button class="btn red" data-action="saveRules">保存规则和参数</button></div><p class="sub">“排除”优先于所有比例；限时活动、低毛利商品可以单独停用推广。</p></div></div>`}
function orderStatus(o){if(o.aftersaleOpen&&o.status!=='settled')return '售后处理中 · 暂缓结算';return o.status==='void'?'全额退款 · 已失效':o.status==='settled'?'已结算':o.status==='paid'?'待履约':due(o)?'可结算':'售后观察'}
function orderCard(o){return `<div class="card"><div class="section-top" style="margin-bottom:5px"><div><span class="mini-label">${o.id} · ${date(o.createdDay)} · 演示订单</span><h3>${product(o.product).name}</h3></div><span class="status ${o.status==='settled'?'green':o.status==='void'?'gray':''}">${orderStatus(o)}</span></div><div class="grid2"><div><div class="rowline"><span>归属推广人</span><b>${o.promoter?person(o.promoter).name:'无推广归属'}</b></div><p class="sub">${esc(o.reason)}</p><div class="rowline"><span>商品实付 / 累计退款</span><span>${money(o.paid)} / ${money(o.refund)}</span></div><div class="rowline"><span>支付时冻结比例</span><b>${percent(o.bp)}</b></div><p class="sub">原规则：${esc(o.ruleName)} · 不含运费、充值交易和赠金支付；本金用于购货可按规则计佣</p></div><div><div class="calc"><p>有效商品实付 × 原单比例，向下取整到分</p><strong>${money(o.commission)}</strong><p>(${money(o.paid)} − ${money(o.refund)}) × ${percent(o.bp)}</p></div><p class="sub">${o.completedDay!==undefined?`履约完成 ${date(o.completedDay)}；售后观察${o.afterDays}天；${date(o.maturityDay)}起可结算`:'确认履约后才开始计算售后观察期'}</p></div></div><div class="actions">${['paid','completed'].includes(o.status)?`<button class="btn" data-aftersale="${o.id}">${o.aftersaleOpen?'模拟售后处理完成':'模拟售后处理中'}</button>`:''}${o.status==='paid'?`<button class="btn dark" data-complete="${o.id}">模拟完成订单</button>`:''}${o.status==='completed'?`<button class="btn red" data-settle="${o.id}" ${due(o)?'':'disabled'}>结算本单佣金</button><button class="btn" data-mature="${o.id}">推进到售后期结束</button>`:''}${o.status==='settled'?`<button class="btn" data-settle="${o.id}">验证重复结算</button>`:''}${o.refundEvents?.length?`<button class="btn" data-repeat-refund="${o.id}">验证重复退款通知</button>`:''}${o.refund<o.paid?`<button class="btn" data-refund20="${o.id}">模拟退款 ${money(Math.min(2000,o.paid-o.refund))}</button><button class="btn" data-refundall="${o.id}">模拟退剩余全款</button>`:''}</div></div>`}
function settlement(){const pid=state.promoter,w=wallet(pid);return `<div class="section-top"><div><div class="eyebrow">佣金与资金</div><h2>订单完成后，再进入结算</h2><p class="intro">示例售后观察${state.config.afterDays}天。支付时展示预估，满足结算条件后才可提现。全程只模拟。</p></div>${selectPerson()}</div>${stats()}${w.debt?`<div class="info rose">当前有${money(w.debt)}待抵扣：来源于已结算订单退款且剩余可提现不足。后续结算或申请释放金额优先抵扣；新申请、审核和打款暂停，需完成异常核对。</div>`:''}<div class="grid2 space-top"><div class="card"><h3>提现申请</h3><p class="sub">当前：${person(pid).name}。金额提交后冻结，审核通过后等待付款。</p><div class="inline-field space-top"><label for="withdrawAmount">申请金额（元）</label><input id="withdrawAmount" type="number" min="0.01" step="0.01" value="${Math.min(1000,w.available)/100}" style="width:130px"><button class="btn red" data-action="withdraw">模拟申请提现</button></div><p class="sub">示例最低${money(state.config.minWithdraw)}，不高于可提现；实际收款方式、手续费、付款能力及财税处理另行确认。</p><div class="info">佣金账户是独立应付记录。不会进入商城购物余额，也不会自动从会员充值账户转钱。</div></div><div class="card"><h3>提现审核与结果</h3>${state.withdrawals.filter(x=>x.promoter===pid).length?state.withdrawals.filter(x=>x.promoter===pid).map(x=>`<div class="space-top"><div class="rowline"><b>${x.id} · ${money(x.amount)}</b><span class="status">${{applied:'申请中 · 已冻结',approved:'审核通过 · 待付款',paid:'模拟已打款',rejected:'已驳回 · 已释放',failed:'付款失败 · 已释放'}[x.status]}</span></div><div class="actions">${x.status==='applied'?`<button class="btn small dark" data-wd="${x.id}" data-next="approved">审核通过</button><button class="btn small" data-wd="${x.id}" data-next="rejected">驳回申请</button>`:x.status==='approved'?`<button class="btn small red" data-wd="${x.id}" data-next="paid">模拟打款成功</button><button class="btn small" data-wd="${x.id}" data-next="failed">模拟付款失败</button>`:`<button class="btn small" data-wd="${x.id}" data-next="${x.status}">验证不重复处理</button>`}</div></div>`).join(''):'<div class="empty space-top">提交申请后，查看冻结、审核与结果。</div>'}</div></div><div class="page-section"><h3>演示订单 / 佣金明细</h3>${state.orders.length?[...state.orders].reverse().map(orderCard).join(''):'<div class="empty">还没有演示订单。<button class="text-link" data-go="share">去分享成交演示 →</button></div>'}</div><div class="card space-top"><h3>本机操作记录</h3>${state.logs.length?`<div class="timeline">${state.logs.slice(0,12).map(x=>`<div class="timeline-item"><b>${esc(x.text)}</b><small>${date(x.day)} · 演示记录</small></div>`).join('')}</div>`:'<p class="sub">生成链接、支付、完成、退款、结算和提现都会留下演示记录。</p>'}</div>`}
const REQUIREMENTS=`便民欢商城分销推广独立场景需求（待讨论）\n日期：2026年11月2日\n定位：独立评估，不纳入既有总方案或1.8万元/15天报价。\n1. 审核指定推广人，可启停推广资格；首期示例只做直接成交佣金，不设计多层团队奖励。\n2. 分享单商品、商品系列或标签页面，带可验证推广标识。客户进入商城正常下单，商城收款与履约。\n3. 归因示例：7天内创建并支付，最后有效链接在支付时锁定当前订单；不永久绑定客户。新老客均可，自购默认排除。真实分享卡片、路径、小程序码与归因需开发验证。\n4. 配置比例：单商品排除优先；单商品>系列>标签>默认。同层按明确优先级，不叠加，同优先级重叠拦发布；0%有效。\n5. 佣金基数为订单商品行有效实付，扣优惠与退款，不含运费、充值交易及赠金支付；本金用于购货可按规则计佣。以整数分计算，逐行向下取整。支付时保存归因、适用范围、规则版本、比例和实付快照。\n6. 支付后预估待结算；订单完成后进入可配置售后观察期，例7天；实际售后未完结不得结算。后台人工冲正须留审计记录。\n7. 部分退款累计重算，全部退款失效；已结算退款冲回，不足进入待抵扣并暂停提现。不能重复结佣、重复冲回或重复释放。\n8. 佣金与购物钱包分开；申请提现先冻结，审核通过待付款，完成后凭结果确认已打款；驳回/付款失败只释放一次。真实付款渠道、身份核验、费用、财税与限额双方另评。\n9. 后台含推广人管理、商品规则、归因记录、订单佣金、提现审核、资金对账、操作日志与权限；推广人只看自己的脱敏明细。\n10. 按门店、商品、推广人、活动看有效销售、净佣金、退款率、复购与佣金成本，不把点击或充值算成交。\n11. 接口：推广资格/分享标识、规则与商品范围、订单行快照、履约售后事件、佣金账本、提现冻结审核付款结果、对账。订单事件与资金流水必须业务幂等。\n12. 评估拆分：可复用商城商品/订单/售后能力，新增推广归因、规则、账本和提现；如涉及微信小店订单应单独核实归因及结算能力，不默认互通。\n待决定：参与人群与审核，适用门店商品，比例与毛利预算，归因窗口及新老客/自购，售后与结算周期，提现方式/门槛/费用/税费，异常责任与预算工期。\n本网页为本机虚构数据样板，不连接真实交易、真实客户或支付。`;
function developer(){return `<div class="section-top"><div><div class="eyebrow">需求讨论 / 费用评估</div><h2>先把边界讲清楚，再决定开发</h2><p class="intro">这是额外功能的独立场景讨论，所有示例规则待确认。请开发评估复用部分、新增部分和第三方条件。</p></div><button class="btn red" data-action="download">下载需求文字</button></div><div class="grid2"><div class="card"><h3>这次样板要解决什么</h3><ul class="list"><li>指定推广人，知道订单由谁带来。</li><li>按单商品、系列、标签配置比例，避免运营逐个重复设置。</li><li>完成履约、扣除退款、过售后期后结佣。</li><li>佣金明细和提现申请可查，购物钱包继续独立。</li></ul></div><div class="card"><h3>待你决定的业务参数</h3><ul class="list"><li>谁能参与、哪些门店/商品可推广、比例与成本预算。</li><li>归因窗口、最后链接规则、新老客和自购范围。</li><li>售后观察期、结算周期、最低提现及付款方式。</li><li>跨店归属、退款追偿、收款身份与相关费用处理。</li></ul></div></div><div class="card space-top"><h3>开发工作包</h3><div class="table-wrap space-top"><table><thead><tr><th>模块</th><th>交付范围</th><th>验收重点</th></tr></thead><tbody><tr><td>推广人 / 分享</td><td>审核、启停、商品/系列/标签分享标识、访问归因</td><td>未审核不能推广；链接篡改校验；推广人仅看自己的数据</td></tr><tr><td>比例规则</td><td>范围、优先级、生效时间、排除、版本与发布权限</td><td>不叠比例；0%生效；冲突拦截；旧单不随改价改佣</td></tr><tr><td>订单佣金</td><td>逐商品行快照、履约与售后事件、结算、退款重算</td><td>支付/履约/退款重复通知不重复记账；未结束售后不结佣</td></tr><tr><td>提现 / 对账</td><td>申请冻结、审核、付款结果、驳回/失败释放、追溯</td><td>余额不足拒绝；超时先查结果；同一业务仅处理一次</td></tr><tr><td>运营报表</td><td>门店、商品、推广人、活动维度</td><td>有效实付、退款、净佣金、待结算、已付款分别统计</td></tr></tbody></table></div></div><div class="grid2 space-top"><div class="card"><h3>建议开发现场演示的用例</h3><ul class="list"><li>100元商品按10%预估10元；退款20元，净佣金8元。</li><li>未完成不结算；观察期内不结算；重复结算无新增。</li><li>支付后将比例改为5%，旧单仍按10%重算。</li><li>提现后退款导致不足，形成待抵扣并暂停新提现。</li><li>驳回或失败仅释放一次，不因重复通知增加余额。</li></ul></div><div class="card"><h3>接入与资金条件另评</h3><p class="sub">提现先展示申请、审核和付款结果；真实自动打款另核商户资格、商家转账权限、场景审核及接口。真实微信分享卡片、小程序码、跨入口归因与收款身份，应由开发结合当前账号能力核实。跳到第三方交易域的订单不能默认算作本商城订单。</p><p class="sub space-top">微信支付官方说明：<a href="https://pay.wechatpay.cn/doc/v3/merchant/4013740645" target="_blank" rel="noopener">商家转账</a> · <a href="https://pay.wechatpay.cn/doc/v3/merchant/4012711988" target="_blank" rel="noopener">接入能力核验</a>。具体以商户当前可用能力为准。</p><p class="sub space-top">推广仅围绕直接商品成交；参与协议、公开规则及具体资金处理在正式立项时确认。本样板不收集真实姓名、手机号或收款账户。</p><div class="actions"><button class="btn" data-action="copyReq">复制开发需求</button><button class="btn" data-action="download">下载文字清单</button></div></div></div>`}
function render(){const content={overview,promoter,share,rules,settlement,developer};$('nav').innerHTML=TABS.map((x,i)=>`<button class="${tab===x[0]?'active':''}" data-go="${x[0]}" aria-current="${tab===x[0]?'page':'false'}"><span>0${i+1}</span>${x[1]}</button>`).join('');$('main').innerHTML=content[tab]()+`<div class="footer"><span>便民欢 · 分销推广独立讨论版 · 2026.11.02</span><span>本机演示保存 <button class="text-link" data-action="reset">重置样板</button></span></div>`;bind()}
function collectRules(){return state.rules.map(r=>{const row=document.querySelector(`[data-rule-id="${r.id}"]`);return row?{...r,enabled:row.querySelector('.ruleEnabled').checked,bp:parseDecimal(row.querySelector('.rulePercent').value,100),priority:parseInteger(row.querySelector('.rulePriority').value,1,999)}:r})}
function saveRules(){const rs=collectRules(),e=validateRules(rs);if(e)return toast(e);const cfg={windowDays:parseInteger($('windowDays').value,1,30),afterDays:parseInteger($('afterDays').value,0,90),minWithdraw:parseDecimal($('minWithdraw').value,100000),selfAllowed:$('selfAllowed').checked};if(!Number.isInteger(cfg.windowDays)||cfg.windowDays<1||cfg.windowDays>30||!Number.isInteger(cfg.afterDays)||cfg.afterDays<0||cfg.afterDays>90||!Number.isInteger(cfg.minWithdraw)||cfg.minWithdraw<1||cfg.minWithdraw>10000000)return toast('请核对窗口1–30天、观察0–90天和提现0.01–100000元');state.rules=rs;state.config=cfg;state.excluded=[...document.querySelectorAll('.excludeProduct:checked')].map(x=>x.value);log('本机保存推广比例和参数，仅影响新订单');commit('规则已保存到本机演示，旧订单快照保留')}
function addRule(){const scope=$('newScope').value,target=$('newTarget').value,bp=parseDecimal($('newPercent').value,100),priority=parseInteger($('newPriority').value,1,999);const rs=[...collectRules(),{id:'R'+Date.now(),scope,target,bp,priority,enabled:true}];const err=validateRules(rs);if(err)return toast(err);state.rules=rs;commit('规则已添加并通过当前商品范围冲突校验')}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制，可粘贴给开发讨论')}catch(e){toast('当前环境无法复制，请使用下载文字清单')}}
function download(){const a=document.createElement('a');a.href='requirements.txt';a.download='便民欢分销推广开发评估说明.txt';a.click()}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>goto(el.dataset.go));$('promoterSelect')?.addEventListener('change',e=>{state.promoter=e.target.value;commit()});$('productSelect')?.addEventListener('change',e=>{state.product=e.target.value;commit()});$('scopeSelect')?.addEventListener('change',e=>{state.shareScope=e.target.value;commit()});document.querySelectorAll('[data-share-product]').forEach(el=>el.onclick=()=>{state.product=el.dataset.shareProduct;state.shareScope='sku';tab='share';location.hash='share';makeLink()});document.querySelectorAll('[data-complete]').forEach(el=>el.onclick=()=>complete(el.dataset.complete));document.querySelectorAll('[data-settle]').forEach(el=>el.onclick=()=>settle(el.dataset.settle));document.querySelectorAll('[data-mature]').forEach(el=>el.onclick=()=>{const o=state.orders.find(o=>o.id===el.dataset.mature);state.day=Math.max(state.day,o.maturityDay);commit('演示日期已推进到该单观察期结束')});document.querySelectorAll('[data-aftersale]').forEach(el=>el.onclick=()=>{const o=state.orders.find(o=>o.id===el.dataset.aftersale);o.aftersaleOpen=!o.aftersaleOpen;log(`${o.id}${o.aftersaleOpen?'进入售后处理中，暂缓结算':'售后已处理完成'}`);commit()});document.querySelectorAll('[data-repeat-refund]').forEach(el=>el.onclick=()=>{const o=state.orders.find(o=>o.id===el.dataset.repeatRefund),event=o.refundEvents[o.refundEvents.length-1];refund(o.id,event.amount,event.id)});document.querySelectorAll('[data-refund20]').forEach(el=>el.onclick=()=>{const o=state.orders.find(o=>o.id===el.dataset.refund20);refund(o.id,Math.min(2000,o.paid-o.refund))});document.querySelectorAll('[data-refundall]').forEach(el=>el.onclick=()=>{const o=state.orders.find(o=>o.id===el.dataset.refundall);refund(o.id,o.paid-o.refund)});document.querySelectorAll('[data-wd]').forEach(el=>el.onclick=()=>updateWithdraw(el.dataset.wd,el.dataset.next));document.querySelectorAll('[data-remove-rule]').forEach(el=>el.onclick=()=>{state.rules=state.rules.filter(r=>r.id!==el.dataset.removeRule);commit('规则已删除，后续新单按剩余规则匹配')});$('newScope')?.addEventListener('change',()=>{const sc=$('newScope').value,items=sc==='sku'?PRODUCTS.map(p=>[p.id,p.name]):sc==='series'?Object.entries(SERIES):sc==='tag'?Object.entries(TAGS):[['all','默认兜底比例']];$('newTarget').innerHTML=items.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==='day'){state.day++;commit('演示日期推进1天')}if(a==='makeLink')makeLink();if(a==='openLink')openLink();if(a==='pay')pay();if(a==='withdraw')withdraw();if(a==='saveRules')saveRules();if(a==='addRule')addRule();if(a==='copyReq')copy(REQUIREMENTS);if(a==='download')download();if(a==='copyLink')copy('说明用小程序路径（非真实上线链接）：\n'+`/pages/${state.lastLink.scope==='sku'?'product/detail':'campaign/list'}?${state.lastLink.scope}=${state.lastLink.target}&ref=${state.lastLink.promoter}`);if(a==='reset'){state=INIT();commit('本机虚构数据已重置')}})}
window.__referralDemo={getState:()=>JSON.parse(JSON.stringify(state)),resolveRule,validateRules,parseDecimal,parseInteger,commission,complete,settle,refund,updateWithdraw,reset:()=>{state=INIT();commit()},goto};render();
</script></body></html>
